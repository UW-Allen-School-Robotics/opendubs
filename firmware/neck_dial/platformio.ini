; The NECK: an M5Dial (ESP32-S3) carrying the pan/tilt, the ToF and the robot-side controls, after
; the tablet took over the face. It REPLACES the Tab5 as the neck and the AtomS3R in the plan --
; not a stand-in for either.
;
; Flashing is the rote M5Stack procedure in CLAUDE.md, with the Dial's one exception:
;
;   uv run --python 3.12 --with platformio --with intelhex pio run -e neck_dial -t upload --upload-port /dev/cu.<port>
;
; THE DIAL NEEDS `esptool --no-stub`, unlike every other board here, and its crash-loop escape is
; holding G0 at power-on. Port A is `Wire`, not `Wire1`.

[env:neck_dial]
; THE DIAL'S FLASHING CONFIGURATION IS NOT GUESSWORK -- it is the maintainers' own working M5Dial
; project (~/Documents/dev/m5dial-roller485), copied rather than re-derived. Four of these were
; wrong in an earlier version of this file and the board simply would not connect:
;
;   board              the Dial is m5stack-stamps3, not the generic S3 devkit
;   upload_speed       a steady 115200; fast speeds do not survive this board's native USB
;   before_reset       no-reset -- esptool must NOT try a DTR/RTS reset, which the Dial's USB
;                      cannot do; the board is put in download mode by hand instead
;   after_reset        watchdog-reset, so it comes back on its own afterwards
;   --no-stub          prepended by tools/pio_no_stub.py, because it is a GLOBAL esptool option
;                      and `upload_flags` would put it after the subcommand, where it is ignored
; UNPINNED, unlike the StamPLC's @7.0.1, and that is deliberate. Pinning 7.0.1 pulls esptool 4.11,
; whose no-stub ROM writes over this board's USB-Serial/JTAG die with "Serial data stream stopped"
; after reading the chip id -- reproduced about eight times here, compressed and uncompressed, with
; retries. The maintainers' own M5Dial project flashes this same board reliably on an unpinned
; platform, so this matches it rather than the StamPLC.
platform = espressif32
board = m5stack-stamps3
framework = arduino
upload_speed = 115200
board_upload.before_reset = no-reset
board_upload.after_reset = watchdog-reset
extra_scripts =
    pre:tools/pio_build_stamp.py     ; CPPDEFINES must be set BEFORE the sources compile
    post:tools/pio_no_stub.py       ; an uploader flag, so after is fine
; The control law lives in neck/ rather than src/ so the host test can compile the SAME translation
; unit without PlatformIO. That puts it outside the default source dir, hence this.
build_src_filter = +<*> +<../neck/*.cpp>
monitor_speed = 115200
; The status badge's panel (src/badge_screen.cpp). LovyanGFX configured by hand, never M5GFX or
; M5Unified, which would start the touch controller on Port A's I2C.
lib_deps =
    lovyan03/LovyanGFX@1.2.31
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1  ; so Serial is the USB CDC, as on every other board here
    -DCORE_DEBUG_LEVEL=0
