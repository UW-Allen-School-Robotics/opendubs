[platformio]
default_envs = tab5

; OpenDubs Tab5 payload/face firmware.
; Uses the pioarduino platform (Arduino-ESP32 with ESP32-P4 support) referenced by URL,
; so it does NOT disturb the StamPLC project's espressif32@7.0.1.
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

board = esp32-p4-evboard
; The Tab5 has 16MB of flash but the board default is the 4MB table: 1.31MB app slots, ~12MB
; unused. The face outgrew that the moment OTA-by-HTTP was added. default_16MB gives two 6.5MB
; OTA slots (NVS stays at its usual offset, so stored tilt limits and IMU offsets survive).
board_build.partitions = default_16MB.csv
upload_speed = 460800
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.19
  ; Both ToF parts appear on OpenDubs builds and are told apart at run time by their
  ; model-ID register — see tofBegin() in lift.cpp. Carrying both drivers is cheaper than
  ; guessing wrong, which is silent: the mismatched driver just fails to init.
  https://github.com/pololu/vl53l0x-arduino.git
  https://github.com/pololu/vl53l1x-arduino.git
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I includes
  -D LV_CONF_INCLUDE_SIMPLE

[env:tab5_ota]
extends = env:tab5
upload_protocol = espota
upload_port = opendubs-tab5.local

; ── BENCH ────────────────────────────────────────────────────────────────────────────────────
; A throwaway harness for a Tab5 on a desk with nothing attached, answering two things the face
; firmware cannot: what a SECOND eye costs, and whether the microphone works and can share the
; I2S port with the speaker.
;
; It lives in THIS project rather than its own, deliberately. A separate project re-resolves the
; pioarduino platform from its URL and lands without the Arduino framework package
; (FRAMEWORK_DIR is then None and the build dies inside arduino.py). This env reuses the
; resolution that already works here, which is worth more than tidiness.
;
;   pio run -e bench -t upload --upload-port /dev/cu.usbmodem2101
[env:bench]
extends = env:tab5
build_src_filter = -<*> +<../bench/>
lib_deps = m5stack/M5Unified@^0.2.19

; ── MIC EVAL ─────────────────────────────────────────────────────────────────────────────────
; Interactive, operator-paced microphone evaluation: live L/R bars with an ES7210 PGA gain knob,
; plus a scripted silence/tone/left/right/centre pass that reports NO SIGNAL rather than a
; verdict when nothing reached the microphone. Separate from [env:bench] so the render harness
; stays flashable.
;
;   pio run -e micbench -t upload --upload-port /dev/cu.usbmodem2101
[env:micbench]
extends = env:tab5
build_src_filter = -<*> +<../bench_mic/>
lib_deps = m5stack/M5Unified@^0.2.19

; ── FACE + GAZE SELF-TEST ────────────────────────────────────────────────────────────────────
; The shipping face, plus a one-shot gaze self-test that runs itself ~4 s after boot and prints
; its verdict. Exists because the gaze signs cannot be checked by sending commands over serial:
; /dev/cu.* does not assert DTR (asserting it resets the chip) and USB-CDC RX is gated on it, so
; written commands are dropped silently. Nor can they be checked by asking whoever is at the
; bench, because usually nobody is. This env needs neither.
;
;   pio run -e tab5_gazetest -t upload --upload-port /dev/cu.usbmodem2101
[env:tab5_gazetest]
extends = env:tab5
build_flags = ${env:tab5.build_flags} -DGAZE_SELFTEST_AT_BOOT

; ── MIRROR BENCH ─────────────────────────────────────────────────────────────────────────────
;   pio run -e mirror -t upload --upload-port /dev/cu.usbmodem2101
[env:mirror]
extends = env:tab5
build_src_filter = -<*> +<../bench_mirror/>
lib_deps = m5stack/M5Unified@^0.2.19
