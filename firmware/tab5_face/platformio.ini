; OpenDubs Tab5 payload/face firmware.
; Uses the pioarduino platform (Arduino-ESP32 with ESP32-P4 support) referenced by URL,
; so it does NOT disturb the StampPLC project's espressif32@7.0.1.
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.19
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
