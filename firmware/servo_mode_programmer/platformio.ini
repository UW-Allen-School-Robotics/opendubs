; goBILDA / REV dual-mode servo reprogrammer, on an Arduino Uno.
;
; The Uno is here for one reason: it drives the servo's signal line at 5 V. An earlier
; attempt from a Tab5 GPIO (3.3 V) produced no effect, and weak drive is the leading
; explanation. The Uno also matches the platform the protocol was originally captured on.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/cu.usbmodem21301
monitor_port = /dev/cu.usbmodem21301
monitor_speed = 115200
