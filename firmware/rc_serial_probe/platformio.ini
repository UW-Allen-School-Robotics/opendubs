[platformio]
default_envs = stamplc

[env:stamplc]
; Pin the PLATFORM too, not just the libs. Left unpinned it resolves to the latest
; espressif32, whose ESP-IDF changed esp_task_wdt_init() to the struct-config form and
; breaks this source. 7.0.1 is the version this firmware was written and flashed against.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; Dual-OTA partition table (app0/app1 ~1.31MB each) so the firmware can self-flash over Ethernet
; via the OTA command. The image is ~0.65MB, so it fits a slot with wide margin. Pinned explicitly
; (not left to the board default) so OTA is guaranteed regardless of flash-size defaults.
board_build.partitions = default.csv

; Pinned to the versions that build. M5StamPLC's git HEAD moved to an
; API-incompatible M5GFX (M5StamPLC.Display became a method → d.width() broke on a
; fresh resolve). Pin M5StamPLC 1.2.0 @ 054fdd1 + its matching M5GFX/M5Unified so
; any machine (Mac or Thor) reproduces the working build.
lib_deps =
  ; Pinned via immutable git TAGS, not the registry. M5Stack withdrew the M5GFX 0.2.21 build
  ; from the PlatformIO registry (it now lists only 0.2.27+), so `m5stack/M5GFX@0.2.21` no
  ; longer resolves and a clean build fails. M5Unified 0.2.15 is still in the registry, but is
  ; pinned the same way so the pair cannot drift apart. ORDER MATTERS: M5GFX/M5Unified come
  ; BEFORE M5StamPLC so its "*" deps resolve to these pinned versions instead of latest (which
  ; reintroduces the M5GFX API break — d.width()).
  https://github.com/m5stack/M5GFX.git#0.2.21
  https://github.com/m5stack/M5Unified.git#0.2.15
  https://github.com/m5stack/M5StamPLC.git#054fdd17e15a183f685628e6843444dd6dae5259
  m5stack/M5-Ethernet@4.0.0

monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

; S3 USB-CDC serial on boot so monitor works over USB.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; monitor_port stays fixed; upload_port left auto-detect so bootloader
; mode (which appears on a different port) is found automatically.
monitor_port = /dev/cu.usbmodem101
