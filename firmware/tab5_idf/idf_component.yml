## IDF Component Manager Manifest File
#
# TRACKED HERE ON PURPOSE. This file is the home of three version pins that were each found the
# hard way, and it previously existed only inside the cloned demo tree -- which is exactly the
# "untracked config is invisible" failure: a flag that changes the build, that `git log -S` cannot
# find, and that nobody can list when asked "what did we change?".
#
# THE PATTERN, THREE TIMES OVER: in this ecosystem a component's own declared version range
# resolves to something that breaks it. Treat a caret range here as a bug until proven otherwise.
dependencies:
  ## Required IDF version
  idf: '>=5.3'
  # Pinned: esp_lvgl_port allows >=8,<10 and the resolver chose 8.4.0, but the Tab5 BSP
  # (m5stack_tab5.c) uses LVGL 9 APIs -- lv_indev_create/set_type/set_read_cb/set_display.
  lvgl/lvgl: '~9.2.2'
  # Pinned to the version in the SHIPPED dependencies.lock. Newer esp_codec_dev fixed a
  # typo (ES7120_SEL_MIC* -> ES7210_SEL_MIC*) that the Tab5 BSP still spells the old way.
  espressif/esp_codec_dev: 1.3.4
  espressif/esp_hosted: 1.4.0
  espressif/esp_wifi_remote: 0.8.5
  chmorgan/esp-audio-player: 1.0.7
  chmorgan/esp-file-iterator: 1.0.0
  espressif/led_strip: 3.0.0
  espressif/esp_lcd_ili9881c: ^1.0.1

  # mDNS, so the head is discoverable by name like the other two devices on the robot's network.
  # opendubs-stamplc.local and opendubs2.local both resolve; the head was the only box without a
  # name, which is what forced a configured IP address into the StamPLC link. Pinned exact rather
  # than a caret range, per this file's standing lesson.
  #
  # IT CREATES A TASK, and that is the risk to watch. The note at the bottom of this file records
  # that with esp-dl linked, one more FreeRTOS task asserts in xPortCheckValidTCBMem because a TCB
  # must live in internal DRAM and there is not enough left. We build the robot image with
  # OPENDUBS_FACEDET=1, so this dependency and face detection are in direct competition for the
  # scarcest resource on the chip.
  espressif/mdns: 1.14.0

  # Face detection. BOTH must be pinned: human_face_detect 0.2.3 declares esp-dl '^3.1.3', and
  # the solver takes that to 3.3.13, which DOES NOT COMPILE against its own consumer
  # (DL_IMAGE_CAP_RGB_SWAP undeclared, MSRPostprocessor ctor mismatch, set_resize_scale_x gone).
  # 3.1.3 builds clean.
  #
  # Carrying these costs NOTHING while the detector is unreferenced -- measured: the app image is
  # byte-identical (0x2cd500) with the components present but unused, because the linker drops
  # them, model data included. The cost appears only when something calls into them:
  # +0.75 MB of app plus a 187 KB model partition, or +1.05 MB with the model in rodata.
  #
  # NOT DECLARED HERE: build.sh appends them only when OPENDUBS_PROBE_FACEDET=1, so a default
  # build carries no risk from a dependency it does not use.
  #
  #     espressif/esp-dl: 3.1.3
  #     espressif/human_face_detect: 0.2.3
  #
  # A NOTE ON A WRONG ACCUSATION, because the wrong version of it was briefly written down here:
  # an esp-dl build aborted at boot with "i2c: CONFLICT! driver_ng is not allowed to be used with
  # this old driver", and esp-dl got the blame. It was innocent. That build also carried a
  # regenerated sdkconfig, and the regenerated sdkconfig alone reproduces the abort with no esp-dl
  # present -- two variables changed at once, and the conclusion went to the interesting one rather
  # than the one that had actually been established. See sdkconfig.vendor.
  #
  # What esp-dl DOES cost, measured: internal RAM. With it linked, creating one more FreeRTOS task
  # asserts in xPortCheckValidTCBMem -- a TCB must sit in internal DRAM and there is not enough
  # left. That is the real integration cost, and it is more restrictive than the flash figure.
