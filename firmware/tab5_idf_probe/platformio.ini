; Throwaway probe: does Arduino-as-an-ESP-IDF-component build for the ESP32-P4?
; If this compiles we can reach esp_driver_cam (the camera) while keeping Arduino +
; M5Unified for the face. If it doesn't, the camera means a full ESP-IDF port.
[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32-p4-evboard
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
