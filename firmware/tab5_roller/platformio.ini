; OpenDubs Tab5 pan/tilt bring-up tool (Roller485 x2).
; SEPARATE project from firmware/tab5_face so the face firmware is untouched —
; reflash tab5_face to restore the face.
;
; Bus wiring (Tab5 pinmap):
;   Grove Port A I2C : SDA=G53  SCL=G54
;   RS485 (SIT3088)  : TX=G20   RX=G21   DE/DIR=G34
[env:tab5_roller]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
upload_port = /dev/cu.usbmodem122201
monitor_port = /dev/cu.usbmodem122201
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.19
  https://github.com/m5stack/M5Unit-Roller.git
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
