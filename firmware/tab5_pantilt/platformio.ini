; OpenDubs Tab5 pan/tilt bring-up (8Servo + ToF behind a PaHub).
; SEPARATE project from firmware/tab5_face so the face firmware is untouched —
; reflash tab5_face to restore the face.
;
; Bus wiring (Tab5 pinmap):
;   Grove Port A I2C : SDA=G53  SCL=G54  ->  PaHub -> {8Servo 0x25, ToF}
[env:tab5_pantilt]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
monitor_speed = 115200
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
