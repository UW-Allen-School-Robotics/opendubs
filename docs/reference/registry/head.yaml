# Troubleshooting entries: the head, the tablet, the stage box, and the dashboard's own front door.
# Owned by the Tablet & head interface lane. Schema and usage: tools/faults.py. After editing, run
#   tools/faults.py --inject
# Links inside text are relative to docs/reference/; `see:` paths are relative to docs/.

entries:
  - code: LINK_FOREIGN_ORIGIN
    title: The dashboard refused a request from another web page
    symptom: [rearm-refused, lift-wont-move]
    rank: 60
    kind: refusal
    seen_on: [dashboard]
    means: >
      Something asked the dashboard to change the robot's state — clear an e-stop, move the lift,
      shut down — from a web page that is not the robot's own dashboard. A browser on the robot's
      network names the page a request came from, and the dashboard only accepts state changes from
      its own pages (on the robot's address, port 8080 or 8443). This is not a login: scripts and
      tools that name no page, such as `curl`, are not affected.
    do:
      - Use the robot's dashboard itself, at its own address, rather than another page or tool in a browser.
      - If a page on another address must control the robot on purpose, add its origin to `OPENDUBS_DASH_ALLOWED_ORIGINS` in the robot's `/etc/opendubs/robot.env` and restart the dashboard.

  - code: HEAD_TABLET_NOT_CHARGING
    title: The tablet is plugged in but not charging
    symptom: [head-dark]
    rank: 40
    kind: warning
    seen_on: [dashboard]
    means: >
      The head tablet charges from the robot's power whenever the robot is on and not e-stopped. Its
      Battery protection stops charging at 80 %, so a healthy tablet on the robot's power reads about
      80 % and "not charging". This warning means it reads well below that and is still not charging,
      or it is losing charge while plugged in: its charger supplies too little, or has failed. Left
      alone, the tablet runs flat and the face goes dark.
    do:
      - Check the USB-C cable at the tablet and at the mount's charger; reseat both.
      - If it persists, check the mount's charger output with a USB power meter, and replace the charger
        or the cable.
      - Until it is fixed, charge the tablet from a wall charger between sessions.

  - code: HEAD_TABLET_HOT
    title: The tablet's battery is hot
    symptom: [head-dark]
    rank: 45
    kind: warning
    seen_on: [dashboard]
    means: >
      The tablet reports a battery temperature of 45 °C or more. Heat ages a lithium battery fastest,
      and a hot tablet throttles itself, which can make the face stutter. Above 40 °C, while no show
      runs, the face already dims and draws fewer frames to cool down. 45 °C is a provisional limit,
      to be revisited against the tablet's datasheet.
    do:
      - Shade the head from direct sun or stage lights, and make sure nothing covers the back of the tablet.
      - If it stays hot with the robot idle, let the screen sleep (Head & face page, SLEEP TABLET) until it cools.

  - code: HEAD_RESTART_SHOW
    title: The tablet won't restart during a show
    symptom: [head-dark]
    rank: 50
    kind: refusal
    seen_on: [dashboard]
    means: >
      The dashboard's RESTART TABLET is refused while a show is loaded or running, because the
      tablet is the face and the show's speaker: a restart would take both away for about a minute.
    do:
      - Stop the show (Shows page, or STOP SHOW on the face), then press RESTART TABLET again.
      - To restart it by hand at any time, hold the tablet's side key and choose Restart.

  - code: HEAD_CALL_SHOW
    title: A call won't start during a show
    symptom: [head-dark]
    rank: 55
    kind: refusal
    seen_on: [dashboard]
    means: >
      START CALL on the Head & face page is refused while a show is loaded or running. A call puts the
      Zoom app in front of the face, and the show's music and the face both play from the face page.
      For the same reason RESTART TABLET is refused during a call.
    do:
      - Stop the show (Shows page, or STOP SHOW on the face), then press START CALL again.
      - To end a call, press END CALL on the Head & face page; the face comes back within a few seconds.

  - code: LINK_STAGE_BOX_OFFLINE
    title: The stage box is not reporting
    symptom: [no-sound]
    rank: 70
    kind: refusal
    seen_on: [dashboard]
    means: >
      The stage box (the small computer that shows the stage page on a projector or a TV, and plays the
      show's music) reports its sound to the robot every 2 seconds. The dashboard has heard nothing from
      it for a while, so it cannot pass it a sound setting, a pairing or a test tone.
    do:
      - Check that the box is powered (its red light) and within range of the robot's Wi-Fi.
      - Wait a minute after powering it on; the card on the Shows page shows it once it reports.

  - code: SHOW_STAGE_SOUND_BUSY
    title: The stage box's sound won't change during a show
    symptom: [no-sound]
    rank: 72
    kind: refusal
    seen_on: [dashboard]
    means: >
      While a show is loaded or playing, the stage box's sound output, its test tone and pairing a
      Bluetooth speaker are refused: the audience would hear the first two, and a newly connected speaker
      can take the sound. Its volume can still be changed.
    do:
      - Stop the show on the Shows page, then change the output, pair or play the test tone.
      - Set up the sound before the show is loaded.
