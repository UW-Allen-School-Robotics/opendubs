# Troubleshooting entries: shows, and the show-audio device that plays their music and other sound.
# Owned by the Choreography lane. Schema and usage: tools/faults.py. After editing, run
#   tools/faults.py --inject
# Links inside text are relative to docs/reference/; `see:` paths are relative to docs/.

entries:
  - code: SHOW_AUDIO_BUSY
    title: A sound sent to the robot was refused because a show has the speaker
    symptom: [no-sound]
    rank: 70
    kind: refusal
    seen_on: [dashboard]
    means: >
      Someone asked the robot to play a sound file (the dashboard's "Play to robot" page) while a show
      was loaded, waiting to start, or running. A show has the robot's speaker to itself, so the
      request was refused rather than queued; nothing is played later.
    do:
      - Wait for the show to finish or be stopped, then send the sound again.
  - code: SHOW_AUDIO_NO_DEVICE
    title: A sound sent to the robot was refused because no speaker is connected
    symptom: [no-sound]
    rank: 71
    kind: refusal
    seen_on: [dashboard]
    means: >
      The robot plays shows, ambient music and sounds sent from a phone through one device: the
      tablet on its head, running the dashboard. No device was connected to play it, so the request
      was refused. A show started now would run without music for the same reason.
    do:
      - Check that the head's tablet is on and showing the dashboard or the face.
      - On the dashboard's Shows page, use "Play show audio here" on the device that should play.
  - code: SHOW_VIDEO_NOT_READY
    title: A show with projector video was refused because the projector isn't ready
    symptom: [show-wont-start]
    rank: 72
    kind: refusal
    seen_on: [dashboard]
    means: >
      This show plays video on the projector and says it must not run without it. The output it uses
      (casting over Wi-Fi, or the HDMI cable) wasn't ready, so the show was refused before anything
      moved. The sentence after the code says why, in the words the projector card on the Shows page
      uses. A show that doesn't insist on its video runs without it instead, saying so.
    do:
      - Look at the projector card on the Shows page; it shows each output and what is missing.
      - For casting, check the projector is on, awake and joined to the robot's Wi-Fi.
      - For HDMI, check the cable and that the projector is on and set to its HDMI input.
      - Or choose the other output (or off) on the projector card, then start the show again.
  - code: SHOW_BASE_NOT_READY
    title: A show with dance steps was refused because the base tracker isn't ready
    symptom: [show-wont-start]
    rank: 74
    kind: refusal
    seen_on: [dashboard]
    means: >
      This show moves the robot's base in small dance steps and says it must not run without them.
      The base tracker (the program on the robot that follows those steps using the base's own
      odometry, and stops the base when a person is in the way) wasn't ready, so the show was refused
      before anything moved. The sentence after the code says why. A show that doesn't insist on its
      dance steps runs without them instead, saying so.
    do:
      - Check that the robot's odometry and both LIDARs are running (the dashboard's robot status).
      - Check the floor around the robot is clear and is not glass-railed or glass-walled nearby; the
        LIDARs see through glass.
      - Start the show again once the tracker reports ready.
  - code: SHOW_VIDEO_BUSY
    title: The projector output couldn't be changed because a show is playing
    symptom: [show-wont-start]
    rank: 73
    kind: refusal
    seen_on: [dashboard]
    means: >
      The video output (casting, HDMI or off) was changed while a show was running. A running show's
      videos are already on their output, so the change was refused rather than switching mid-show.
    do:
      - Change the output before starting the show, or stop the show first.
