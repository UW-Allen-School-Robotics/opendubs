# The symptom groups the troubleshooting page is organised by, in page order.
# Owned by the Docs and BOM lane. An entry joins a group by naming its id in `symptom:`;
# a group with no entries yet is not published.
#
#   id:     lower-case-with-hyphens; also the section's anchor on the page
#   title:  what the operator sees, in their words
#   intro:  optional; one short paragraph

symptoms:
  - id: wont-start
    title: The robot won't power up, or the dashboard won't load

  - id: wont-drive
    title: The robot won't drive
    intro: >
      The drive is gated by several conditions at once, and the controller re-checks every one of
      them continuously. The dashboard names the condition that is stopping it; find that one
      below, or work down the list.

  - id: rearm-refused
    title: Re-arm is refused
    intro: >
      Re-arming closes the drive contactor, so the dashboard guards it and lists every reason it
      refused. Clear each one, then re-arm again.

  - id: head-dark
    title: The head is dark or offline
    intro: >
      The head is the tablet on the robot's neck, running on its own battery, and the M5Dial that
      moves the neck.

  - id: lift-wont-move
    title: The lift won't move
    intro: >
      The lift answers to the same safety gate as the drive, plus its own pinch guard near the
      bottom of its travel.

  - id: arms-wont-activate
    title: The arms won't activate

  - id: arms-wont-park
    title: An arm won't park, hold or power down

  - id: teleop-wont-move
    title: Teleop doesn't move the arm

  - id: show-wont-start
    title: A show won't start, or stops

  - id: no-sound
    title: The robot won't play a sound
    intro: >
      A sound sent to the robot plays on its own speaker. It is refused while a show has the
      speaker, and when no speaker is connected; the entries below say which.

  - id: voice-quiet
    title: The robot won't listen or talk
    intro: >
      The robot's voice runs on its computer and listens through the head tablet's microphone.
      When it cannot listen, the face greys out or hides its Talk button rather than inviting
      speech nobody will hear.

  - id: power-warning
    title: A power or temperature warning
