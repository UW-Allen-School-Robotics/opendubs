name: ros

# Tests for the Thor's ROS nodes that run without ROS: the StamPLC peer guard drive_bridge.py
# uses before it parses [ODO] or sends DRIVE, and when the tablet camera-demand node posts. Path-filtered to software/ros/.

# CI minutes are metered (the user, 2026-10-21): no run on draft PRs or on the push to main, which the PR
# already ran. Mark a PR ready (`gh pr ready <n>`) to run it; workflow_dispatch runs it by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "software/ros/**"
      - ".github/workflows/ros.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    # A draft PR's skipped run must not carry the real check's name: with both a skipped draft-time
    # "test" and the real one from `gh pr ready` on one commit, `gh pr checks` and the PR page show
    # only one of them, which has hidden real failures (#521, #540).
    name: "${{ github.event.pull_request.draft && 'test (draft, skipped)' || 'test' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 software/ros/tests/test_plc_peer.py
      - run: python3 software/ros/tests/test_tablet_camera_demand.py
      - run: python3 software/ros/tests/test_skeleton_relay.py
      - run: python3 software/ros/tests/test_scan_body_filter.py
      - run: python3 software/ros/tests/test_floorplan.py
      - run: python3 software/ros/tests/test_people_guard.py
      - run: python3 software/ros/tests/test_dance_tracker.py
      - run: python3 software/ros/tests/test_drive_scale.py
      - run: python3 software/ros/tests/test_base_selector.py
      - run: python3 software/ros/tests/test_head_joints.py
      - run: python3 -m py_compile software/ros/*.py
