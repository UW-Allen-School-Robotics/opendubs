name: Hygiene

# Repo-wide checks owned by the Hygiene lane (CLAUDE.md, "Lanes"). They run on every PR and every
# push to main, whatever paths changed, and look only at what the change adds. The findings
# register and the plan for each check are in notes/hygiene-findings.md.
#
# Mode of each check. Change `warn` to `block` here once its existing findings are fixed; the
# register says when each one can.
#   secrets  block  history is clean apart from one recorded finding (tools/hygiene/gitleaks-ignore)
#   ignore   block  nothing tracked matches an ignore rule today
#   size     warn
#   exif     warn
#   names    skipped: no deny-list is configured, by the maintainers' decision (2026-10-14);
#            names are caught in review. Setting the HYGIENE_NAME_DENYLIST secret turns it on.

# Draft PRs are skipped to save CI minutes: open a PR as a draft and run `gh pr ready <n>` when
# it is ready, which triggers this. A skipped required check counts as passing, but a draft cannot
# be merged anyway. Pushes to main always run: they are the safety net for a direct push by an
# admin, which bypasses the PR checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# The draft flag is part of the group. A push made while the PR is a draft, followed seconds
# later by `gh pr ready`, produces two runs, and GitHub can deliver the draft-time one (which
# skips) AFTER the ready one. Sharing a group, the late skip cancelled the real run and left
# "skipped" as the result, which a required check reads as passing (seen on #470). In separate
# groups it can't cancel it. A later push still cancels its own superseded run.
concurrency:
  group: hygiene-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  hygiene:
    # A draft PR's run is skipped, and it must not carry the required check's name. Otherwise the
    # PR has two "Hygiene checks" results, the skipped draft-time one and the real one from
    # `gh pr ready`, and `gh pr checks` and the PR page show only one of them, which hid real
    # failures (#521, #540). The skipped row is named "Hygiene (draft, skipped)" instead.
    name: "${{ github.event.pull_request.draft && 'Hygiene (draft, skipped)' || 'Hygiene checks' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR's own head, not the merge commit, so the range below is exactly its commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Work out the range this change adds
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "checking $(git rev-list --count "$base..HEAD") commit(s) since ${base:0:12}"

      - name: Install gitleaks (pinned, checksum-verified)
        run: tools/hygiene/install-gitleaks.sh

      - name: Install exiftool
        run: sudo apt-get install -y --no-install-recommends libimage-exiftool-perl >/dev/null

      # --redact=100 replaces every secret in the output, so a match is never written to the log.
      # Run the same command locally to see where a finding is.
      - name: Secrets (blocking)
        if: always()
        run: |
          gitleaks git --no-banner --redact=100 --verbose \
            --config tools/hygiene/gitleaks.toml \
            --gitleaks-ignore-path tools/hygiene/gitleaks-ignore \
            --log-opts="$BASE..HEAD" .

      - name: Ignore rules, file size, image metadata
        if: always()
        run: python3 tools/hygiene/check_files.py --base "$BASE" --size warn --exif warn

      # A refuse("X") / helpLink("X") / @fault X in the source must have a registry entry, or an
      # operator's "?" link opens nothing. Owned by the Docs and BOM lane (tools/faults.py). It runs
      # here, as a step in this already-running job, because a separate workflow costs a whole
      # billed minute per run. PyYAML comes from the runner's python3-yaml, not pip: the runner's
      # system Python refuses a bare pip install.
      - name: Troubleshooting codes are registered
        if: always()
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-yaml >/dev/null
          python3 tools/faults.py --check

      # Developer Certificate of Origin: every commit the change adds carries a Signed-off-by that
      # matches its author (git commit -s; CONTRIBUTING.md). DCO_SINCE is the day the requirement
      # started: commits authored before it, and the merge and squash commits GitHub creates, are
      # exempt, so no history is rewritten.
      - name: Commits are signed off (DCO)
        if: always()
        env:
          DCO_SINCE: "2026-10-23"
        run: python3 tools/hygiene/check_dco.py --base "$BASE"

      - name: Personal names (skipped unless a deny-list is configured)
        if: always()
        env:
          HYGIENE_NAME_DENYLIST: ${{ secrets.HYGIENE_NAME_DENYLIST }}
        run: python3 tools/hygiene/check_names.py --base "$BASE" --mode warn
