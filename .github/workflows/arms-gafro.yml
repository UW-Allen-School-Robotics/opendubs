name: arms-gafro

# The arms' gafro model is generated, and a stale one puts the head cap (or the ready pose, or the bimanual task space) on the wrong side of what
# the controllers read. tools/arm_gafro_model.py --check rebuilds it from openarm_assets and compares what MuJoCo compiles from each. It needs
# mujoco and openarm_assets, not gafro: software/openarm/gafro/check.py (the controllers against the model) needs the published gafro, which is
# a C++ build, so it is run by hand: see software/openarm/gafro/README.md.
#
# openarm_assets is pinned: its main moving would turn this red for a change that is not in this repository. Bump the pin with the model.

on:
  push:
    branches: [main]
    paths:
      - "tools/arm_gafro_model.py"
      - "description/openarm/**"
      - "software/openarm/gafro/**"
      - "software/choreo/cue.py"
      - ".github/workflows/arms-gafro.yml"
  pull_request:
    paths:
      - "tools/arm_gafro_model.py"
      - "description/openarm/**"
      - "software/openarm/gafro/**"
      - "software/choreo/cue.py"
      - ".github/workflows/arms-gafro.yml"

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mujoco numpy pyyaml "openarm_assets @ git+https://github.com/personalrobotics/openarm_assets@148e840"
      - name: The committed model is what the generator builds
        run: python3 tools/arm_gafro_model.py --check
      - name: The controllers file parses
        run: python3 -c "import yaml; print(sorted(yaml.safe_load(open('software/openarm/gafro/controllers.yaml'))['controllers']))"
