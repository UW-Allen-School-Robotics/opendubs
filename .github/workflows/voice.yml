name: voice

# The voice service's tests (software/voice). Job `test`: fake audio and fake backends, no robot,
# no tablet, no model, no network beyond loopback ports the tests open themselves. Job
# `speech-deps`: the real pinned speech packages (below). The safety boundary tests
# (test_safe_tools.py) read the head protocol's vocabularies, so a protocol change runs this too.

on:
  push:
    branches: [main]
    paths:
      - "software/voice/**"
      - "software/head-protocol/head_protocol.py"
      - ".github/workflows/voice.yml"
  pull_request:
    paths:
      - "software/voice/**"
      - "software/head-protocol/head_protocol.py"
      - ".github/workflows/voice.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # the Thor's
      - run: pip install websockets==17.2
      - run: python3 software/voice/tests/test_wire_audio.py
      - run: python3 software/voice/tests/test_safe_tools.py
      - run: python3 software/voice/tests/test_face_gate.py
      - run: python3 software/voice/tests/test_brains.py
      - run: python3 software/voice/tests/test_conversation.py
      - run: python3 software/voice/tests/test_server.py
      - run: python3 software/voice/tests/test_speech.py
      - run: python3 software/voice/tests/test_fetch_models.py
      - run: python3 software/voice/tests/test_no_gpl.py
      - run: python3 software/voice/tests/test_llm.py
      - run: python3 software/voice/tests/test_wake.py
      - run: for f in software/voice/image/*.sh; do bash -n "$f"; done

  # English only, no GPL (the project team, 2026-10-14): install the pinned speech packages exactly
  # as Dockerfile.voice does, refuse if any GPL package or espeak-ng is among them, and run Kokoro's
  # English pipeline with no espeak-ng (smoke_speech_deps.py). Downloads PyTorch's CPU wheel, the
  # 3 MB pronunciation fallback and a 2 KB config from their pinned commits; never the big weights.
  speech-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # the Thor's
      - run: pip install -r software/voice/image/requirements-torch-cpu.txt
      - run: pip install -r software/voice/image/requirements-speech.txt
      - run: pip install --no-deps -r software/voice/image/requirements-speech-nodeps.txt
      - run: pip install -r software/voice/image/requirements.txt
      - run: python3 software/voice/image/check_no_gpl.py --no-system
      - run: python3 software/voice/tests/smoke_speech_deps.py
