name: Troubleshooting registry

# The docs workflow only runs when docs/ changes, but a dashboard or firmware change can use a
# troubleshooting code the registry lacks. This runs the registry check on those paths too. It
# needs only PyYAML, so it takes seconds and skips the MkDocs build.

on:
  push:
    branches: [main]
    paths:
      - "docs/reference/**"
      - "tools/faults.py"
      - "software/**"
      - "firmware/**"
      - ".github/workflows/faults.yml"
  pull_request:
    # Keep this list in step with the push filter above.
    paths:
      - "docs/reference/**"
      - "tools/faults.py"
      - "software/**"
      - "firmware/**"
      - ".github/workflows/faults.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faults-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Registry check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      # Fails on a schema error, a stale troubleshooting/glossary page, or a code the source
      # names (refuse("X"), helpLink("X"), @fault X) that the registry does not have.
      - run: python3 tools/faults.py --check
