name: face-web

# The tablet face engine (software/face-web) held to the head protocol: its own model and protocol
# code run headless in Node behind a UDP door, a reference neck beside it, and the head protocol's
# conformance suite with --active --motion against both. No browser; nothing is drawn — what is
# checked is that the face answers every message as notes/design/head-protocol.md says.

# CI cost (the maintainers, 2026-10-21): no run for a draft PR or a push to main, which the PR already
# ran; mark the PR ready to run it, or start it by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "software/face-web/**"
      - "!software/face-web/**/*.md"
      - "software/head-protocol/**"
      - "!software/head-protocol/**/*.md"
      - ".github/workflows/face-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    name: "${{ github.event.pull_request.draft && 'conformance (draft, skipped)' || 'conformance' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash software/face-web/tests/conformance.sh
