name: robot-description

# Every file derived from the robot description must match its sources: description/describe.py
# --check runs each generator's own check (gen_urdf.py: opendubs.urdf from dimensions.yaml, plus the
# one-tree-rooted-at-base_link assertion; tools/arm_chain.py: chain.json from the vendored v1.urdf).
# A hand edit to a derived file, or a source change without a re-run, fails here. Pure Python + PyYAML.

on:
  push:
    branches: [main]
    paths:
      - "description/**"
      - "tools/arm_chain.py"
      - ".github/workflows/robot-description.yml"
  pull_request:
    paths:
      - "description/**"
      - "tools/arm_chain.py"
      - ".github/workflows/robot-description.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 description/describe.py --check
