name: robot-description

# opendubs.urdf is generated from description/opendubs/dimensions.yaml by gen_urdf.py, and the
# two must not drift: a hand edit to the URDF, or a yaml change without a re-run, fails here.
# The check also asserts the TF tree is one tree rooted at base_link. Pure Python + PyYAML.

on:
  push:
    branches: [main]
    paths:
      - "description/opendubs/**"
      - ".github/workflows/robot-description.yml"
  pull_request:
    paths:
      - "description/opendubs/**"
      - ".github/workflows/robot-description.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 description/opendubs/gen_urdf.py --check
