site_name: OpenDubs
site_description: A low-cost, low-fabrication, open-source mobile robot
repo_url: https://github.com/UW-Allen-School-Robotics/opendubs
docs_dir: docs

# A link to a heading that does not exist is only "info" by default, which let nine of them sit
# unnoticed. As a warning it fails `mkdocs build --strict`, so CI catches the next one.
validation:
  anchors: warn

theme:
  name: material
  # No Google Fonts: the robot serves its own copy of this site to a tablet that may have no
  # internet, and every page would stall on the font request first.
  font: false
  icon:
    logo: material/robot-mower
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/embed-facade.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Material's bundled icons as inline monochrome SVG (:octicons-play-24: and the like).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      # Mermaid. Material ships the renderer; this fence stops superfences from treating the
      # block as source and highlighting it instead of drawing it.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["includes"]
      check_paths: true

