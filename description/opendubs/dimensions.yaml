# The numbers the simulation model is built from, each with where it came from.
#
# ============================== THE GEOMETRY IS REAL. THE DYNAMICS ARE NOT. =============
# Lengths, axes and pivots trace to CAD or to a measurement, and where one does not it says
# so. Masses, inertias, stiffnesses, damping and speeds do NOT: the chassis mass is a guess,
# the head's is mesh volume at the density of water, the arm masses are someone else's, and
# the lift's speed and thrust were chosen to be physically possible rather than measured.
# Anything this model says about force, torque, sag, tipping or timing is decoration.
# =======================================================================================
#
# This file exists so the model is never the place a dimension is invented. Anything here that
# is also a CONTROL value belongs somewhere else and is only mirrored here for geometry:
#   * arm joint limits    -> the arm software's hw_validation/joint_limits.yaml
#   * per-robot wiring    -> stays on the robot
#   * head pan/tilt trim  -> the Tab5's own NVS
#
# units: millimetres, degrees. MJCF is metres, so the model scales by 0.001 like the arm assets.

datum:
  # THE CAD MODEL ORIGIN, not a convenience frame invented for the simulator. Meshes are
  # exported at it and every offset here is the real spatial relationship, so there is one
  # origin to reason about rather than two that must be kept in agreement.
  note: "CAD model origin; x forward, y left, z up"
  floor_z_mm: -94.0   # DERIVED from the wheel meshes: 140 mm wheels centred at z=-24

lift:
  # The Z-axis. Modelled as a PRISMATIC joint along +z: the real mechanism is a scissor, but
  # choreography only cares about where the platform ends up, not how it gets there.
  type: prismatic
  axis: [0, 0, 1]
  stroke_mm: 275.1           # source: lift manufacturer spec, 10.83 in
  speed_mm_s: PLACEHOLDER 56
  thrust_n: PLACEHOLDER 2500
  # Nobody has timed this lift or measured its thrust. Both exist so the model cannot do
  # something the real mechanism cannot: with stiffness alone the actuator drove the platform
  # into its upper stop hard enough to throw the whole robot off the ground. A screw-driven
  # scissor is slow and pushes about as hard as its motor. Capped, the full stroke takes ~5 s
  # and the base rises 0.08 mm on arrival. Time a real stroke and these become real.
  platform_face_z_mm: 357.5  # CAD z of the plate's top face, fully DOWN (mesh reads 356.6..357.6)
  # NOTE (bug, not a dimension): firmware/tab5_face/src/lift.h scales its height bar
  # MIN_MM=0 .. MAX_MM=900, so with a 275 mm stroke the bar can only ever reach ~30%.

arms:
  # Not modelled here. The bimanual OpenArm model already carries the arms AND the stock V1
  # extrusion frame they mount to, with collision meshes and per-motor joint defaults:
  #   openarm_assets/models/openarm/generated/openarm_bimanual_decorated.xml
  # We include it and place its ROOT BODY; we do not redraw any of it.
  model: openarm_bimanual_decorated.xml
  root_body: openarm_body_link0
  root_mass_kg: 13.89                  # from that model
  shoulder_offset_from_root_mm: [0, 31, 698]   # from that model: left arm link0 pos
  mount:
    # Where openarm_body_link0's ORIGIN sits, in CAD coordinates, with the lift fully down.
    parent: lift_platform      # so it rises with the Z-axis
    xyz_mm: [423.0, 0.0, 357.5]
    rpy_deg: [0, 0, 0]
    # x: 423 is the ORIGIN, confirmed by eye on a render. An earlier reading took it as the
    # body's CENTRE and derived 453, which landed the frame's front face exactly flush with the
    # lift plate's front edge — that looked like confirmation and was coincidence. The arms sat
    # 30 mm too far forward. Worth remembering: a number that agrees with a guess is not
    # evidence for the guess.
    # y: shared centreline, 0 = 0 (confirmed: the body mesh is centred in y).
    # z: 357.5 = the plate's top face lowered; the body's own origin is at the BOTTOM of the
    #    extrusion (its mesh spans z 0..773), so it simply stands on the plate.
  derived:
    shoulder_height_above_floor_mm: { lowered: 1149.5, raised: 1424.6 }

head:
  # Tab5 panel on a pan/tilt bracket, with the D415 on top. Pan then tilt, both servos through
  # the 8Servo unit.
  parent: lift_platform     # confirmed: the face/pan-tilt translates in +z with the extrusion
  tilt_axis_xyz_mm: [423.0, 0.0, 1245.575]   # MEASURED in CAD, lift fully down
  pan_axis_xyz_mm: [423.0, 0.0, 1245.575]    # CONFIRMED on the centreline, vertical through the tilt point
  pan_axis: [0, 0, 1]
  tilt_axis: [0, 1, 0]
  servo: goBILDA 2000-series dual-mode, 300 deg travel out of the box (manufacturer spec)
  # https://www.gobilda.com/2000-series-dual-mode-servo-25-2-torque/
  # 500-2500 us over 300 deg = 6.667 us/deg. Both axes use one of these through the 8Servo.
  pan_range_deg: [-150, 150]
  # Pan has NO mechanical limit of its own: no stop in the bracket, no slip ring on this build.
  # The horn was set at the middle of the servo's travel, so the limit is simply +/-150. Left
  # deliberately wide -- whether the head can sweep that far without meeting the arms or the
  # extrusion is for the model to answer, not for the joint range to pre-empt.
  tilt_travel_deg: { up: 93.75, down: 15.75, hard_stop_down: 20.25 }
  tilt_us: { up: 920, horizontal: 1545, down: 1650, hard_stop: 1680, us_per_deg: 6.667 }
  # MEASURED in us, DERIVED in degrees. firmware/tab5_pantilt/README.md crept the servo in
  # small steps watching current, soft-stopping at 0.20 A so it never stalled; the horizontal
  # point is independently confirmed by the holding current peaking there, which is where the
  # gravitational moment is greatest.
  #
  # That README converts at 7.14 us/deg from an ASSUMED 280 deg of travel. The servo spec says
  # 300, and the README's own observation agrees with 300: it calls 920 us "slightly past
  # vertical", which at 7.14 would be 87.5 deg -- slightly SHORT of vertical. At 6.667 it is
  # 93.75, past vertical, as seen. The assumed 280 was the odd one out.
  #
  # Not cross-checked against firmware/tab5_roller's 99 deg span: that is the Roller485
  # mechanism, with a slip-ring pan, so it is a different head and not evidence about this one.
  # NOBODY HAS PUT A PROTRACTOR ON THIS AXIS. One reading at 920 us would settle it.
  # SIGN: in the model, positive tilt is DOWN (rotation about +y swings +x toward -z).
  mass_kg: MESH-DERIVED, NOT WEIGHED
  # The tilt body comes out at 2.97 kg, because MuJoCo takes mass from mesh volume at its
  # default 1000 kg/m3 -- solid water. The real head is nearer 0.8 kg (Tab5 ~400 g, D415 72 g,
  # brackets). The viewer's head actuator gains were sized against the 2.97 figure, so they are
  # conservative rather than wrong, but any statement about servo torque, sag or dynamics from
  # this model is currently meaningless. Weigh the head, or set a density, before making one.
  parts_frame: >
    pt_tilt_body, pt_screen_cover and D415 are exported IN CAD COORDINATES, so the model places
    them by cancelling the head frame's offset rather than positioning each part. No second
    origin, nothing to re-derive.
  export_pose: yawed_180
  # RESOLVED: the head faces FORWARD on the robot, so the export is posed at pan=180 and the
  # model corrects it. As exported the screen (x 363..386) and camera (x 364..384) sat behind
  # the tilt axis at 423, looking toward -x; the wheel meshes put forward at +x (FL/FR x=528,
  # RL/RR x=120). opendubs.xml applies the 180 deg yaw in the same transform that places the
  # meshes, so there is still only one transform per part.
  y_asymmetry_mm: 1.85
  # The PAN AXIS is on the centreline; the parts around it are not. The Tab5 carries a camera on
  # one side, so the assembly sits about 1.85 mm off centre in y. That is real geometry and is
  # left alone. An earlier version subtracted it to "centre" the head, which moved it a
  # millimetre off where CAD puts it. The yaw carries the asymmetry to the other side, which is
  # what physically happens when the head turns round: placed, the screen spans y -80.9..77.2.
  extents_cad_mm:
    # Measured off the supplied meshes AS EXPORTED (before the yaw and the y correction).
    # x forward, y left, z up. Placed, they become:
    #   pt_tilt_body    x 393.37..468.75  y -76..76   z 1192.78..1292.63
    #   pt_screen_cover x 460.00..482.75  y -79..79   z 1189.78..1295.63
    #   d415            x 461.55..481.60  y -49..50   z 1302.12..1325.12
    pt_tilt_body:    { x: [377.25, 452.63], y: [-74.15, 77.85], z: [1192.78, 1292.62] }
    pt_screen_cover: { x: [363.25, 386.00], y: [-77.15, 80.85], z: [1189.78, 1295.62] }
    d415:            { x: [364.40, 384.45], y: [-48.04, 50.82], z: [1302.12, 1325.12] }
    # The D415's own dimensions check out against the datasheet: 98.9 wide (y), 20.1 deep (x),
    # 23.0 tall (z) -- so the mesh is the camera, at the right scale, looking along x.
  camera: D415
  channel: enclosed
  # The 1120 extrusion is not modelled, and does not need to be: it fits INSIDE the tilt body,
  # so nothing can strike it without striking that first. Carried as an open gap for a while on
  # the assumption that a missing structural member understates clearance. Here it does not.

chassis:
  footprint_mm: TODO        # frame outline (x by y)
  height_mm: TODO           # top of the base frame above the floor
  wheel_positions_mm: TODO  # four mecanum wheel centres, for a visual reference only
  mass_kg: 40   # ESTIMATED, NOT WEIGHED -- and the model needs it, because the base now moves.
  # Mesh-derived mass would be 169 kg: chassis.stl is a 28-triangle bounding box and MuJoCo
  # fills it with water. 40 kg with the centre of mass low (batteries and motors sit near the
  # floor, not at the box centroid) behaves sanely. Weigh the robot before believing dynamics.

meshes:
  # What we still need. Simplified is not just acceptable, it is preferred: collision geometry
  # wants to be coarse and convex-ish, and the arms already carry the detail that matters.
  #
  # Format: binary STL, millimetres, z up, exported AT THE CAD MODEL ORIGIN. Do not re-origin
  # anything for the simulator's benefit: one origin, and the relationships written down.
  # Supplied, exported at the CAD origin (so no re-origining is needed):
  chassis:        { primitive: box, span_mm: { x: [-32, 612], y: [-324.5, 324.5], z: [-48, 356] } }
  # NOT a mesh. chassis.stl was a bounding shape whose extrude left an 8 mm step at two
  # diagonally opposite corners — an artefact, not the robot. Stating the same volume as a box
  # primitive is exact and has no corner to explain. Swap back to a mesh when the chassis is
  # drawn for real.
  wheels:         { files: [meshes/FL-wheel.stl, meshes/FR-wheel.stl, meshes/RL-wheel.stl, meshes/RR-wheel.stl],
                    diameter_mm: 140, width_mm: 50, centre_z_mm: -24, wheelbase_mm: 408, track_mm: 589,
                    centres_mm: { FL: [528, 294.5], FR: [528, -294.5], RL: [120, 294.5], RR: [120, -294.5] } }
  # The four wheel meshes are BYTE-IDENTICAL 412-triangle cylinders: no roller detail, no
  # handedness. The model's rollers are therefore authored -- 16 capsules of radius 10 mm on a
  # 60 mm hub, reproducing the measured 140 mm diameter and 50 mm width. Count and capsule
  # shape are a simplification; real rollers are barrels that taper at the ends.
  rollers:
    skew_deg: 45
    handedness: { FL: -45, FR: +45, RL: +45, RR: -45 }
    # NOT guessed: taken from driveMix() in firmware/rc_serial_probe, where FL and RR share a
    # strafe sign and FR and RL share the opposite one -- then verified in simulation. The
    # first attempt had it mirrored, which drove forward and reversed perfectly and only
    # strafed the wrong way. Check strafe, not drive.
  lift_platform:  { file: meshes/z-axis-down.stl, span_mm: { x: [148, 548], y: [-160, 160], z: [356.6, 357.6] } }
  # The head, supplied IN CAD COORDINATES (see head.extents_cad_mm above):
  head_tilt_body: { file: meshes/pt_tilt_body.stl }
  head_screen:    { file: meshes/pt_screen_cover.stl }
  head_camera:    { file: meshes/D415.stl }
  head_channel:   { file: meshes/1120_channel.stl }   # kept, but not placed: see head.channel
