dding:24px;border:var(--weight) solid var(--stroke);border-radius:11.7px;background:var(--fill);z-index:2}.card h2{font-size:18.3px;letter-spacing:-.15px;white-space:nowrap;line-height:1.34;font-weight:700;margin:0 0 7.8px}.desc{font-size:14.3px;line-height:1.365;white-space:pre-line;margin:0}.when{font-size:13px;line-height:1.4;margin:10px 0 0;color:#5b6577;white-space:pre-line}.when code{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--ink)}.screen{width:100%;aspect-ratio:617/368;overflow:hidden;margin:18px 0 0;background:white;border:1px solid #d5d9df;border-radius:10px}.screen iframe{width:100%;height:100%;display:block;border:0;background:white}.links{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:1}.edge-label{position:absolute;z-index:3;font-size:14.3px;line-height:1.365;white-space:pre-line;background:transparent;padding:0;pointer-events:none}.edge-label a{pointer-events:auto;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:700}.map{margin-top:34px}.map h2{font-size:22.1px;margin:0 0 12px;line-height:1.35}.map table{border-collapse:collapse;width:100%;font-size:14.3px;line-height:1.45}.map th{text-align:left;font-weight:700;padding:8px 14px 8px 0;border-bottom:1.2px solid var(--line)}.map td{padding:9px 14px 9px 0;border-bottom:1px solid #d5d9df;vertical-align:top}.map td:last-child{font-weight:600}.map .note{font-size:13px;color:#5b6577;margin:10px 0 0}.fault{margin-top:30px;padding-top:30px;border-top:1px solid #808080}.fault h2{font-size:22.1px;margin:0 0 8px;line-height:1.35}.fault{display:grid;grid-template-columns:1fr auto;column-gap:28px;align-items:start}.fault p{white-space:pre-line;font-size:14.3px;line-height:1.5;margin:0}.fault .screen{width:352px;max-width:100%;margin:0}@media(max-width:700px){.fault{grid-template-columns:1fr}.fault .screen{margin-top:16px}.page-head h1{font-size:23px}}@media(max-width:700px){main{padding:22px 16px}.mode-tabs{gap:22px}.mode-tabs button{font-size:18px}. <header class="page-head"><div><h1>OpenDubs Halloween Expressions</h1><p>The tablet face for the Halloween demo: a ghost with ten expressions, and when each one shows.</p></div><div class="ver-tabs" role="tablist" aria-label="Version"><button id="v1Tab" role="tab" aria-selected="false" tabindex="-1">V1<small>Design</small></button><button id="v2Tab" role="tab" aria-selected="true">V2<small>As built</small></button></div></header>
<p class="version" id="about"></p>

<section id="flowPanel" role="tabpanel" aria-labelledby="idleTab"><div class="rules" id="rules"></div><div class="viewport"><div class="scaled"><div class="graph" id="graph"></div></div></div><div class="map" id="map"></div></section>

<script id="source" type="application/json">"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Ghost States\u003c/title>\n\u003cstyle>\n  :root { --bg: #ffffff; --ink: #0b0b0b; --panel: rgba(20,22,26,.9); --panel-ink: #e8eaed; --muted: #9aa3ad; }\n  html, body { margin: 0; height: 100%; background: #2b2d31; overflow: hidden; font: 13px system-ui, sans-serif; }\n  canvas { display: block; width: 100vw; height: 100vh; }\n  #panel { position: fixed; right: 12px; top: 12px; width: 250px; max-height: calc(100vh - 48px); overflow-y: auto;\n           padding: 12px 14px; border-radius: 12px; background: var(--panel); color: var(--panel-ink); }\n  #panel.hidden { display: none; }\n  #panel h1 { font-size: 14px; margin: 0 0 2px; }\n  #panel p { margin: 0 0 6px; color: var(--muted); }\n  #panel summary { margin: 12px 0 0; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--panel-ink);\n                   text-transform: uppercase; letter-spacing: .04em; }\n  #panel details[open] summary { color: var(--muted); }\n  label { display: block; margin: 8px 0 2px; }\n  label span { float: right; color: var(--muted); font-variant-numeric: tabular-nums; }\n  input[type=range] { width: 100%; }\n  button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; font: inherit;\n           background: #2a2f36; color: #fff; cursor: pointer; }\n  button.on { background: #1f6feb; }\n  #state { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv id=\"panel\">\n  \u003ch1>Ghost \u00b7 DOZE \u2192 LOOKOUT \u2192 GROOVE \u00b7 SMILE \u2192 PEEK \u00b7 THINK \u00b7 EEK! \u00b7 FOCUS \u00b7 HAPPY\u003c/h1>\n  \u003cp>H panel \u00b7 T tablet frame \u00b7 N someone nearby \u00b7 D nod off \u00b7 L look out \u00b7 G groove \u00b7 P peek \u00b7 K think \u00b7 E eek \u00b7 F focus \u00b7 Y happy \u00b7 move the mouse to be the person (left or right half: which way it tilts)\u003c/p>\n  \u003clabel>Face size \u003cspan id=\"v-size\">\u003c/span>\u003cinput id=\"size\" type=\"range\" min=\"0.5\" max=\"1.3\" step=\"0.01\" value=\"1\">\u003c/label>\n  \u003cdetails>\u003csummary>Mouth\u003c/summary>\n  \u003clabel>Flame speed \u003cspan id=\"v-speed\">\u003c/span>\u003cinput id=\"speed\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Flame size \u003cspan id=\"v-amp\">\u003c/span>\u003cinput id=\"amp\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Tip flicker \u003cspan id=\"v-lick\">\u003c/span>\u003cinput id=\"lick\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003c/details>\n  \u003cdetails>\u003csummary>Doze \u00b7 nodding off\u003c/summary>\n  \u003clabel>Alone: every (s) \u003cspan id=\"v-aloneEvery\">\u003c/span>\u003cinput id=\"aloneEvery\" type=\"range\" min=\"2\" max=\"20\" step=\"0.5\" value=\"6.5\">\u003c/label>\n  \u003clabel>Someone nearby: starts after (s) \u003cspan id=\"v-nodAfter\">\u003c/span>\u003cinput id=\"nodAfter\" type=\"range\" min=\"2\" max=\"60\" step=\"1\" value=\"10\">\u003c/label>\n  \u003clabel>Someone nearby: then every (s) \u003cspan id=\"v-nodEvery\">\u003c/span>\u003cinput id=\"nodEvery\" type=\"range\" min=\"4\" max=\"40\" step=\"1\" value=\"14\">\u003c/label>\n  \u003clabel>Lids sinking (s) \u003cspan id=\"v-nodDroop\">\u003c/span>\u003cinput id=\"nodDroop\" type=\"range\" min=\"0.5\" max=\"6\" step=\"0.1\" value=\"2.8\">\u003c/label>\n  \u003clabel>Snap open (s) \u003cspan id=\"v-nodSnap\">\u003c/span>\u003cinput id=\"nodSnap\" type=\"range\" min=\"0.04\" max=\"0.5\" step=\"0.01\" value=\"0.1\">\u003c/label>\n  \u003clabel>How far it sinks (1 = doze-2) \u003cspan id=\"v-nodDepth\">\u003c/span>\u003cinput id=\"nodDepth\" type=\"range\" min=\"0.2\" max=\"1\" step=\"0.01\" value=\"1\">\u003c/label>\n  \u003clabel>Head drop \u003cspan id=\"v-nodHead\">\u003c/span>\u003cinput id=\"nodHead\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Spider web while nodding off \u003cspan id=\"v-web\">\u003c/span>\u003cinput id=\"web\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Breathing in the eyes \u003cspan id=\"v-breath\">\u003c/span>\u003cinput id=\"breath\" type=\"range\" min=\"0\" max=\"0.4\" step=\"0.01\" value=\"0.08\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Lookout\u003c/summary>\n  \u003clabel>Nods before looking out (up to) \u003cspan id=\"v-nodsBefore\">\u003c/span>\u003cinput id=\"nodsBefore\" type=\"range\" min=\"1\" max=\"5\" step=\"1\" value=\"2\">\u003c/label>\n  \u003clabel>Turn to a side (s) \u003cspan id=\"v-turn\">\u003c/span>\u003cinput id=\"turn\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.05\" value=\"0.7\">\u003c/label>\n  \u003clabel>Hold each side (s) \u003cspan id=\"v-hold\">\u003c/span>\u003cinput id=\"hold\" type=\"range\" min=\"0.4\" max=\"4\" step=\"0.1\" value=\"1.6\">\u003c/label>\n  \u003clabel>Sweep right \u2192 left (s) \u003cspan id=\"v-sweep\">\u003c/span>\u003cinput id=\"sweep\" type=\"range\" min=\"0.3\" max=\"3\" step=\"0.05\" value=\"1.0\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Smile (someone stays nearby)\u003c/summary>\n  \u003clabel>Smiles after they stay (s) \u003cspan id=\"v-smileAfter\">\u003c/span>\u003cinput id=\"smileAfter\" type=\"range\" min=\"0\" max=\"8\" step=\"0.1\" value=\"1.2\">\u003c/label>\n  \u003clabel>Smile comes in (s) \u003cspan id=\"v-smileIn\">\u003c/span>\u003cinput id=\"smileIn\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.5\">\u003c/label>\n  \u003clabel>Tip flicker while smiling \u003cspan id=\"v-smileFlicker\">\u003c/span>\u003cinput id=\"smileFlicker\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.4\">\u003c/label>\n  \u003clabel>One smiling eye holds (s) \u003cspan id=\"v-smileHold\">\u003c/span>\u003cinput id=\"smileHold\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.05\" value=\"0.8\">\u003c/label>\n  \u003clabel>Both smiling eyes hold (s) \u003cspan id=\"v-smileBoth\">\u003c/span>\u003cinput id=\"smileBoth\" type=\"range\" min=\"0.1\" max=\"5\" step=\"0.05\" value=\"1.8\">\u003c/label>\n  \u003clabel>Giggle (both eyes) \u003cspan id=\"v-giggle\">\u003c/span>\u003cinput id=\"giggle\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Giggle speed \u003cspan id=\"v-giggleSpeed\">\u003c/span>\u003cinput id=\"giggleSpeed\" type=\"range\" min=\"0.3\" max=\"2.5\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Eye change (s) \u003cspan id=\"v-smileMorph\">\u003c/span>\u003cinput id=\"smileMorph\" type=\"range\" min=\"0.05\" max=\"1.5\" step=\"0.05\" value=\"0.3\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Focus (demo: picking and handing over candy)\u003c/summary>\n  \u003clabel>Eyes change into focus (s) \u003cspan id=\"v-focusIn\">\u003c/span>\u003cinput id=\"focusIn\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.6\">\u003c/label>\n  \u003clabel>Each look holds (s) \u003cspan id=\"v-focusHold\">\u003c/span>\u003cinput id=\"focusHold\" type=\"range\" min=\"0.2\" max=\"4\" step=\"0.1\" value=\"1.3\">\u003c/label>\n  \u003clabel>Glance between looks (s) \u003cspan id=\"v-focusMorph\">\u003c/span>\u003cinput id=\"focusMorph\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.5\">\u003c/label>\n  \u003clabel>Sparkle twinkle \u003cspan id=\"v-sparkle\">\u003c/span>\u003cinput id=\"sparkle\" type=\"range\" min=\"0\" max=\"2\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Happy (demo: celebrate)\u003c/summary>\n  \u003clabel>Blinks per second \u003cspan id=\"v-happyRate\">\u003c/span>\u003cinput id=\"happyRate\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.05\" value=\"0.35\">\u003c/label>\n  \u003clabel>How far each blink squints (1 = 1057:1452) \u003cspan id=\"v-happySquash\">\u003c/span>\u003cinput id=\"happySquash\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Eyes turn with the squint (\u00b0) \u003cspan id=\"v-happyTilt\">\u003c/span>\u003cinput id=\"happyTilt\" type=\"range\" min=\"0\" max=\"25\" step=\"0.5\" value=\"8\">\u003c/label>\n  \u003clabel>Stars twinkle \u003cspan id=\"v-happyTwinkle\">\u003c/span>\u003cinput id=\"happyTwinkle\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.85\">\u003c/label>\n  \u003clabel>Bat swings (px) \u003cspan id=\"v-batSwing\">\u003c/span>\u003cinput id=\"batSwing\" type=\"range\" min=\"0\" max=\"30\" step=\"0.5\" value=\"9\">\u003c/label>\n  \u003clabel>Bat swings per second \u003cspan id=\"v-batRate\">\u003c/span>\u003cinput id=\"batRate\" type=\"range\" min=\"0.2\" max=\"3\" step=\"0.05\" value=\"0.9\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>EEK! (\"trick or treat\" accepted)\u003c/summary>\n  \u003clabel>Startled face holds (s) \u003cspan id=\"v-eekHold\">\u003c/span>\u003cinput id=\"eekHold\" type=\"range\" min=\"0.5\" max=\"6\" step=\"0.1\" value=\"2.4\">\u003c/label>\n  \u003clabel>Pop in \u003cspan id=\"v-eekPop\">\u003c/span>\u003cinput id=\"eekPop\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Lower lip wave \u003cspan id=\"v-lipWave\">\u003c/span>\u003cinput id=\"lipWave\" type=\"range\" min=\"0\" max=\"4\" step=\"0.05\" value=\"1.6\">\u003c/label>\n  \u003clabel>Sweat cycles per second \u003cspan id=\"v-sweatRate\">\u003c/span>\u003cinput id=\"sweatRate\" type=\"range\" min=\"0.2\" max=\"3\" step=\"0.05\" value=\"0.75\">\u003c/label>\n  \u003clabel>Sweat drifts away as it goes \u003cspan id=\"v-sweatDrip\">\u003c/span>\u003cinput id=\"sweatDrip\" type=\"range\" min=\"0\" max=\"20\" step=\"0.5\" value=\"6\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Think / puzzled (listening, or didn't understand)\u003c/summary>\n  \u003clabel>Each tilt holds (s) \u003cspan id=\"v-thinkHold\">\u003c/span>\u003cinput id=\"thinkHold\" type=\"range\" min=\"0.1\" max=\"3\" step=\"0.05\" value=\"0.7\">\u003c/label>\n  \u003clabel>Tilt change (s) \u003cspan id=\"v-thinkMorph\">\u003c/span>\u003cinput id=\"thinkMorph\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.6\">\u003c/label>\n  \u003clabel>Far-side flame lower \u003cspan id=\"v-thinkDrop\">\u003c/span>\u003cinput id=\"thinkDrop\" type=\"range\" min=\"0\" max=\"60\" step=\"1\" value=\"22\">\u003c/label>\n  \u003clabel>Comes in / goes (s) \u003cspan id=\"v-thinkIn\">\u003c/span>\u003cinput id=\"thinkIn\" type=\"range\" min=\"0.1\" max=\"1.5\" step=\"0.05\" value=\"0.4\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Peek (smiling at the same person a while)\u003c/summary>\n  \u003clabel>Peeks after smiling (s) \u003cspan id=\"v-peekAfter\">\u003c/span>\u003cinput id=\"peekAfter\" type=\"range\" min=\"1\" max=\"30\" step=\"0.5\" value=\"10\">\u003c/label>\n  \u003clabel>Hide the eyes first (s) \u003cspan id=\"v-peekHide\">\u003c/span>\u003cinput id=\"peekHide\" type=\"range\" min=\"0\" max=\"1.5\" step=\"0.05\" value=\"0.35\">\u003c/label>\n  \u003clabel>Startle pop size \u003cspan id=\"v-peekPop\">\u003c/span>\u003cinput id=\"peekPop\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Startled eyes keep growing \u003cspan id=\"v-peekGrow\">\u003c/span>\u003cinput id=\"peekGrow\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.2\">\u003c/label>\n  \u003clabel>Startled eyes hold (s) \u003cspan id=\"v-peekHold1\">\u003c/span>\u003cinput id=\"peekHold1\" type=\"range\" min=\"0.2\" max=\"3\" step=\"0.05\" value=\"1.4\">\u003c/label>\n  \u003clabel>Each fierce face holds (s) \u003cspan id=\"v-peekFierce\">\u003c/span>\u003cinput id=\"peekFierce\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.55\">\u003c/label>\n  \u003clabel>Change between fierce faces (s) \u003cspan id=\"v-peekFierceMorph\">\u003c/span>\u003cinput id=\"peekFierceMorph\" type=\"range\" min=\"0.1\" max=\"1.5\" step=\"0.05\" value=\"0.45\">\u003c/label>\n  \u003clabel>Cheeky smile hold (s) \u003cspan id=\"v-peekHold2\">\u003c/span>\u003cinput id=\"peekHold2\" type=\"range\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"1.8\">\u003c/label>\n  \u003clabel>Cheeky shake (two rocks) \u003cspan id=\"v-peekGiggle\">\u003c/span>\u003cinput id=\"peekGiggle\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003c/details>\n  \u003cdetails open>\u003csummary>Groove (alone for a long while)\u003c/summary>\n  \u003clabel>Starts after alone (s) \u003cspan id=\"v-grooveAfter\">\u003c/span>\u003cinput id=\"grooveAfter\" type=\"range\" min=\"5\" max=\"180\" step=\"5\" value=\"60\">\u003c/label>\n  \u003clabel>Tempo (BPM) \u003cspan id=\"v-bpm\">\u003c/span>\u003cinput id=\"bpm\" type=\"range\" min=\"60\" max=\"160\" step=\"1\" value=\"104\">\u003c/label>\n  \u003clabel>Snap onto each beat \u003cspan id=\"v-grooveSnap\">\u003c/span>\u003cinput id=\"grooveSnap\" type=\"range\" min=\"0.1\" max=\"0.9\" step=\"0.05\" value=\"0.35\">\u003c/label>\n  \u003clabel>Hold groove-5 (beats) \u003cspan id=\"v-g5Beats\">\u003c/span>\u003cinput id=\"g5Beats\" type=\"range\" min=\"1\" max=\"12\" step=\"1\" value=\"4\">\u003c/label>\n  \u003clabel>Phrases before resting \u003cspan id=\"v-phrases\">\u003c/span>\u003cinput id=\"phrases\" type=\"range\" min=\"1\" max=\"6\" step=\"1\" value=\"2\">\u003c/label>\n  \u003clabel>Wiggle on groove-5 \u003cspan id=\"v-g5Wiggle\">\u003c/span>\u003cinput id=\"g5Wiggle\" type=\"range\" min=\"0\" max=\"3\" step=\"0.05\" value=\"1\">\u003c/label>\n  \u003clabel>Eyes bob on the beat \u003cspan id=\"v-beatBob\">\u003c/span>\u003cinput id=\"bea const demoLink=findLabel('02 / DEMO MODE');demoLink.style.textAlign='center';const link=document.createElement('a');link.href='#demoTab';link.textContent=demoLink.textContent;link.style.cssText='pointer-events:auto;color:inherit;text-decoration:underline;text-underline-offset:3px';link.onclick=e=>{e.preventDefault();$('demoTab').click();$('demoTab').focus({preventScroll:true})};demoLink.replaceChildren(link);
centerAbove('No person detected',a('look','l')[1],410,600);
centerAbove('No person detected for ~60 s',a('look','r')[1],a('look','r')[0],a('groove','l')[0]);
centerAbove('Person / face cue\nstays nearby',a('smile','l')[1],410,600);
const lost=findLabel('Person no longer detected\n(after a brief grace period)'),lookBottom=a('look','b')[1];lost.style.top=(lookBottom+(90-lost.offsetHeight)/2)+'px';lost.style.left=(a('look','b')[0]+14)+'px';
const smile=findLabel('Smiling for ~10 s;\nno request accepted\n→ Peek once');smile.style.top=(a('smile','b')[1]+(a('peek','t')[1]-a('smile','b')[1]-smile.offsetHeight)/2)+'px';
centerAbove(DATA.labels['938:711'],a('eek','l')[1],530,660);centerAbove(DATA.labels['951:760'],a('think','l')[1],530,660);
}else{
for(const [text,from,to] of [['938:698','pick','retry'],['996:1273','handoff','assistance']])centerAbove(text,a(from,'r')[1],a(from,'r')[0],a(to,'l')[0]);
centerAbove(DATA.labels['938:692'],a('hand','l')[1],a('clarify','r')[0],a('hand','l')[0]);
const centerBetween=(key,top,bottom,x)=>{const l=findLabel(key);l.style.width='max-content';l.style.maxWidth='250px';l.style.left=(x+14)+'px';l.style.top=(top+(bottom-top-l.offsetHeight)/2)+'px'};
const returnY=rect('hand').y-75;
centerBetween('938:680',a('pick','b')[1],returnY,a('pick','b')[0]);
centerBetween('938:683',a('hand','b')[1],a('handoff','t')[1],a('hand','b')[0]);
centerBetween('938:686',a('handoff','b')[1],a('happy','t')[1],a('handoff','b')[0]);
for(const key of ['938:695','938:701']){const l=findLabel(key);l.style.top=(returnY-l.offsetHeight-12)+'px'}

}
}
function resize(){const width=document.querySelector('.viewport').clientWidth,scale=Math.min(1,Math.max(1000,width)/1560);$('graph').style.transform=`scale(${scale})`;const fs=document.querySelector('#fault .screen');if(fs)fs.style.width=document.querySelector('.card .screen').offsetWidth*scale+'px';Object.assign(document.querySelector('.scaled').style,{width:1560*scale+'px',height:parseFloat($('graph').style.height)*scale+'px'})}
for(const m of ['idle','demo']){$(m+'Tab').onclick=()=>{mode=m;render();window.scrollTo(0,0)};$(m+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'idle':e.key==='End'?'demo':m==='idle'?'demo':'idle';$(next+'Tab').click();$(next+'Tab').focus()}}}
function renderFault(){const f=$('fault');f.replaceChildren();const title=document.createElement('h2');title.textContent=DATA.fault.title;const copy=document.createElement('div');copy.append(title,rich(document.createElement('p'),DATA.fault.desc));f.append(copy);if(DATA.fault.preview)f.append(frame('fault',DATA.fault.title))}
for(const v of ['v1','v2']){$(v+'Tab').onclick=()=>{ver=v;render()};$(v+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=v==='v1'?'v2':'v1';$(next+'Tab').click();$(next+'Tab').focus()}}}
addEventListener('resize',resize);document.fonts.ready.then(render);
</script></body></html>
