# OpenDubs fleet access — the source of truth for who can log into which robot.
#
# Adding someone: drop their PUBLIC key in access/<name>.pub, add a section here,
# open a PR. Merging grants access; deleting the section revokes it. Git history is
# the audit trail — who was added, by whom, when, and why.
#
# Push access to this directory is equivalent to root on every managed robot.
# It should stay behind branch protection and review.
#
# Apply with:  python3 tools/access.py --diff <robot>     (show what would change)
#              python3 tools/access.py --apply <robot>    (make it so)

[fleet]
# Only robots listed here can be managed. Robot 1 is deliberately absent — it is a
# development machine, and omitting it means the tool physically refuses to touch it.
robots = opendubs2

[andrew]
# Firmware and pan/tilt bring-up — needs root.
# Two machines; both keys land in the one account.
key     = andrew.pub, andrew-dev2.pub
group   = admin
robots  = opendubs2
expires = 2026-12-15

[raj]
# Payload comms protocol and Tab5 firmware — needs root for flashing.
key     = raj.pub
group   = admin
robots  = opendubs2
expires = 2026-12-15

[eric]
# Repo collaborator; robot work alongside the others.
key     = eric.pub
group   = admin
robots  = opendubs2
expires = 2026-12-15
