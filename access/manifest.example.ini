# OpenDubs fleet access — EXAMPLE. The real manifest is NOT in this repo.
#
# The real one names people, so it lives in the git-ignored ops/access/manifest.ini of the
# checkout you run tools/access.py from, with each person's public key beside it. Copy this file
# there to start one. See access/README.md.
#
# Write access to the real manifest is equivalent to root on every managed robot.
#
#   python3 tools/access.py --check            validate the manifest, no robot needed
#   python3 tools/access.py --diff  <robot>    show what would change
#   python3 tools/access.py --apply <robot>    make it so

[fleet]
# Only robots listed here can be managed. Leave a development robot out and the tool refuses it.
robots  = opendubs2
# Accounts the tool must never touch, on top of root and the system accounts. Put your own admin
# account here.
protect = your-admin-username

# One section per person. The section name is the Unix account the tool creates, so choose it once:
# renaming a section later DELETES that account and its home directory, then creates a new one.

[firmware-admin]
# Firmware bring-up: needs root for flashing. Several machines' keys can share one account.
key     = firmware-admin.pub, firmware-admin-laptop2.pub
group   = admin
robots  = opendubs2
expires = 2026-12-15

[student-operator]
# Runs the robot: logs and service restarts, no firmware or network changes.
key     = student-operator.pub
group   = operator
robots  = opendubs2
expires = 2026-12-15
