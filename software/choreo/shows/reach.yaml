id: reach
name: Reach for it
# A palette routine (workplan 1.13): the operator picks it, it runs, and the operator picks what
# comes next — celebrate or shrug — depending on how the grab went. That is the reaction this show
# could not choose for itself. Like every palette routine it ends in the rejoin state (arms at rest,
# head centred), so anything can follow it.
#
# Forethought, which a timeline CAN express: look first, show intent, THEN reach — the expressive
# move just before the functional one (Takayama, Dooley & Ju, HRI 2011).
palette: { label: Reach, order: 1 }
slots: [ARM_R, GRIP_R, HEAD, FACE]
requires:
  arms: active
  tab5: true
  rc_authority: AUTO

cues:
  - { t: 0.0, slot: HEAD, pan: 110, tilt: 80 }
  - { t: 1.0, slot: FACE, do: emote, name: ALERT }
  - { t: 5.0, slot: ARM_R, joints: { 1: 20, 2: 20, 4: 70 } }
  - { t: 5.0, slot: GRIP_R, do: open }
  - { t: 7.0, slot: GRIP_R, open: 0.1 }
  # bring it back and look forward: the rejoin state
  - { t: 12.0, slot: ARM_R, pose: rest }
  - { t: 12.0, slot: HEAD, pan: 90, tilt: 90 }
