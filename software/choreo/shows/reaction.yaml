id: reaction
name: Reach, and react — the outcome it cannot see
# A test of the format (workplan 7.3, PA-6.5). The best-supported finding in expressive-robot HRI
# is that REACTING to an outcome improves how competent a robot seems whatever the outcome, and that
# reacting to a FAILURE partly makes up for it (Takayama, Dooley & Ju, HRI 2011). So this show
# reaches for something, and should react to whether the grip worked. It can do the first half.
#
# What it CAN say: forethought — the head looks at the target before the arm moves, and the face
# shows intent before the reach — because that is only timing, and timing is what a timeline is.
# What it CANNOT say: "if the grip failed, play react_failure". A show is a fixed timeline; nothing
# in it can choose at run time. Both reactions are written as clips; only one can be placed.
slots: [ARM_R, GRIP_R, HEAD, SOUND, FACE]
requires:
  arms: active
  tab5: true
  rc_authority: AUTO

clips:
  react_success:
    length_s: 2.0
    cues:
      - { t: 0.0, slot: FACE, do: emote, name: SOFT }
      - { t: 0.0, slot: SOUND, do: play, sound: attend }
      - { t: 0.2, slot: HEAD, tilt: 100 }
      - { t: 1.2, slot: HEAD, tilt: 90 }
  react_failure:                       # written, never placed: there is no way to choose it
    length_s: 2.5
    cues:
      - { t: 0.0, slot: FACE, do: emote, name: SLEEPY }
      - { t: 0.0, slot: SOUND, do: play, sound: refuse }
      - { t: 0.3, slot: HEAD, pan: 75 }
      - { t: 1.3, slot: HEAD, pan: 105 }
      - { t: 2.3, slot: HEAD, pan: 90 }

cues:
  # forethought: look, then show intent, THEN reach — the expressive move just before the functional
  - { t: 0.0, slot: HEAD, pan: 110, tilt: 80 }
  - { t: 1.0, slot: FACE, do: emote, name: ALERT }
  - { t: 5.0, slot: ARM_R, joints: { 1: 20, 2: 20, 4: 70 } }
  - { t: 5.0, slot: GRIP_R, do: open }
  - { t: 7.0, slot: GRIP_R, open: 0.1 }
  # the outcome: assumed to be a success, because the show cannot know
  - { t: 8.0, clip: react_success }
  - { t: 12.0, slot: ARM_R, joints: { 1: 0, 2: 5, 4: 10 } }
  - { t: 12.0, slot: HEAD, pan: 90, tilt: 90 }
