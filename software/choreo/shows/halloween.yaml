id: halloween
name: Halloween — the zombie greeting
# A seasonal show, written as a test of the format (workplan 7.3): whatever it cannot say is a
# finding, recorded in notes/design/choreo-example-shows.md and at the end of this file.
#
# The palette gave up orange — too close to DEGRADED's amber — so purple and toxic green carry it,
# exactly as the Halloween face theme had to (workplan-tab5-idf.md 1.2f).
slots: [ARM_L, ARM_R, GRIP_L, GRIP_R, HEAD, LIFT, SOUND, FACE, LIGHT]
themes: [halloween]      # content now (face/themes in the content folder), no longer built into the face
requires:
  arms: active
  tab5: true
  rc_authority: AUTO
notes: >
  No music: a seasonal track would be copyrighted, and none is committed. Seconds throughout.
# Sounds this show expects in shows/sounds/, supplied locally and never committed (format §3a).
sounds: [creak]

clips:
  # A light flicker: four quick changes between two Halloween colours.
  flicker:
    length_s: 1.2
    cues:
      - { t: 0.0, slot: LIGHT, do: color, rgb: [120, 0, 200], br: 80 }
      - { t: 0.3, slot: LIGHT, do: color, rgb: [60, 255, 40], br: 30 }
      - { t: 0.6, slot: LIGHT, do: color, rgb: [120, 0, 200], br: 90 }
      - { t: 0.9, slot: LIGHT, do: color, rgb: [60, 255, 40], br: 60 }

clearance: { min_mm: 38.9, at_s: 0.0, between: "oa_openarm_left_hand_collision / oa_openarm_body_link0_collision", checked_for: "3deb9e14d07a@dc74e24f" }
cues:
  # lights down, eyes narrow, a falling two-note "refuse" as the hello
  - { t: 0.0, slot: LIGHT, do: color, rgb: [60, 255, 40], br: 40 }
  - { t: 0.0, slot: FACE, do: theme, name: halloween }      # a content theme; stays after the show
  - { t: 0.0, slot: FACE, do: emote, name: SQUINT }
  - { t: 0.5, slot: SOUND, do: play, sound: refuse }
  - { t: 0.5, slot: HEAD, pan: 90, tilt: 72 }

  # the zombie reach: both arms come up and forward, slowly
  - { t: 6.0, slot: ARM_L, joints: { 1: 25, 2: 15, 4: 50 } }
  - { t: 6.0, slot: ARM_R, joints: { 1: 25, 2: 15, 4: 50 } }
  - { t: 6.0, slot: HEAD, tilt: 95 }
  - { t: 6.5, clip: flicker }
  - { t: 7.0, slot: GRIP_L, open: 0.6 }
  - { t: 7.0, slot: GRIP_R, open: 0.6 }

  # rise up — and the eyes go wide
  - { t: 8.0, slot: LIFT, do: up, secs: 4 }
  - { t: 8.0, slot: SOUND, do: play, sound: creak, secs: 3 }
  - { t: 9.0, slot: FACE, do: emote, name: ALERT }
  - { t: 9.0, slot: LIGHT, do: color, rgb: [120, 0, 200], br: 100 }
  - { t: 10.0, slot: HEAD, pan: 120, tilt: 90 }
  - { t: 12.5, slot: HEAD, pan: 60 }
  - { t: 13.0, clip: flicker }

  # and back to rest, sleepy, lights released to the robot's own colour
  - { t: 15.0, slot: GRIP_L, do: close }
  - { t: 15.0, slot: GRIP_R, do: close }
  - { t: 20.0, slot: ARM_L, pose: rest }
  - { t: 20.0, slot: ARM_R, pose: rest }
  - { t: 20.0, slot: HEAD, pan: 90, tilt: 90 }
  - { t: 20.5, slot: FACE, do: emote, name: SLEEPY }
  - { t: 21.0, slot: SOUND, do: play, sound: mode }
  - { t: 22.0, slot: LIGHT, do: release }

# WHAT THIS SHOW WANTED AND COULD NOT SAY (notes/design/choreo-example-shows.md):
#  - the perimeter band's motion: no cue drives it (and it is suppressed on the face)
#  - nothing stopped it from choosing an orange or a red LIGHT, which on the robot's state light
#    reads as DEGRADED or E-STOP — it avoided them by hand
