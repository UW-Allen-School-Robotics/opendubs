id: robotic-smile
name: Robotic smile
# A palette routine on the opening of a song: the quiet intro, the first build, and back to rest. The
# runner fades the song out when the routine ends, so the whole file is used, untrimmed.
#
# The song is NOT in the repo (shows/audio/.gitignore): copy robotic_smile.mp3 to shows/audio/ on
# the machine that runs it. Its grid was measured, not guessed: 123 BPM, the first beat at 1.625 s,
# beats steady to about 9 ms. A bar is 1.95 s, so bar n starts at 1.625 + 1.951(n-1) s.
#
# An arm keyframe's time is when the arm ARRIVES; a head cue's is when the head STARTS to turn.
palette: { label: Robotic smile, order: 5 }
slots: [ARM_L, ARM_R, HEAD, FACE, SOUND]
requires:
  arms: active
  tab5: true
  rc_authority: AUTO
music:
  file: audio/robotic_smile.mp3
  bpm: 123
  offset_s: 1.625
  beats_per_bar: 4

clips:
  # a wrist wave, two beats per swing: 30 deg in 0.98 s stays well inside the wrist's 70 deg/s
  wave_r:
    length_beats: 8
    cues:
      - { beat: 1, slot: ARM_R, joints: { 7: 15 } }
      - { beat: 3, slot: ARM_R, joints: { 7: -15 } }
      - { beat: 5, slot: ARM_R, joints: { 7: 15 } }
      - { beat: 7, slot: ARM_R, joints: { 7: 0 } }
  # the face on the beat: wide-eyed on each odd bar's downbeat, droopy on the next — two strongly
  # contrasting expressions, so the change reads as a hit rather than a mood (asked 2026-10-08,
  # after the first live run's four mood changes went unnoticed)
  face_beat:
    length_beats: 8
    cues:
      - { beat: 1, slot: FACE, do: emote, name: ALERT }
      - { beat: 5, slot: FACE, do: emote, name: SLEEPY }
  # a head nod, down on the beat, up two beats later
  nod:
    length_beats: 4
    cues:
      - { beat: 1, slot: HEAD, tilt: 82 }
      - { beat: 3, slot: HEAD, tilt: 98 }

cues:
  # the intro (bars 1-4): wake up, look around, and lift both arms slowly, arriving on bar 5
  - { t: 0.0, slot: SOUND, do: play, sound: attend }
  - { bar: "1.1", clip: face_beat, repeat: 8 }     # every bar, bars 1-16
  - { bar: "1.1", slot: HEAD, tilt: 100 }
  - { bar: "3.1", slot: HEAD, pan: 105 }
  - { bar: "4.1", slot: HEAD, pan: 75 }
  - { bar: "5.1", slot: ARM_L, joints: { 2: 30, 4: 60 } }
  - { bar: "5.1", slot: ARM_R, joints: { 2: 30, 4: 60 } }

  # the music kicks in (bars 5-8): look ahead, the right hand waves, then the left answers
  - { bar: "5.1", slot: HEAD, pan: 90, tilt: 90 }
  - { bar: "5.3", clip: wave_r }
  - { bar: "7.1", slot: ARM_L, joints: { 7: 0 } }        # hold still until its turn
  - { bar: "7.3", clip: wave_r, mirror: true }

  # bars 9-12: the forearms pump in turn, one bar each, while the head nods along
  - { bar: "9.1", clip: nod, repeat: 4 }
  - { bar: "9.1", slot: ARM_R, joints: { 4: 60 } }        # hold, so the first pump is one bar long
  - { bar: "10.1", slot: ARM_R, joints: { 4: 80 } }
  - { bar: "10.1", slot: ARM_L, joints: { 4: 60 } }
  - { bar: "11.1", slot: ARM_R, joints: { 4: 60 } }
  - { bar: "11.1", slot: ARM_L, joints: { 4: 80 } }
  - { bar: "12.1", slot: ARM_R, joints: { 4: 80 } }
  - { bar: "12.1", slot: ARM_L, joints: { 4: 60 } }
  - { bar: "13.1", slot: ARM_R, joints: { 4: 60 } }
  - { bar: "13.1", slot: ARM_L, joints: { 4: 60 } }

  # bars 13-16: both arms reach out together, a happy chirp, and everything home by bar 17
  - { bar: "14.1", slot: ARM_L, joints: { 1: 15 } }
  - { bar: "14.1", slot: ARM_R, joints: { 1: 15 } }
  - { bar: "15.1", slot: SOUND, do: play, sound: heard }
  - { bar: "16.1", slot: HEAD, pan: 90, tilt: 90 }
  - { bar: "17.1", slot: ARM_L, pose: rest }
  - { bar: "17.1", slot: ARM_R, pose: rest }
