id: christmas
name: Christmas — a wave in warm white and blue
# A seasonal show, written as a test of the format (workplan 7.3). Its findings are in
# notes/design/choreo-example-shows.md and at the end of this file.
#
# Christmas wants red and green. On this robot red is E-STOP and green is SAFE IDLE, on the face
# and on the state light, so the show uses warm white, white and a cold blue. It first used a gold,
# which the validator now refuses as reading too much like DEGRADED amber (plan 1.8).
slots: [ARM_L, ARM_R, GRIP_L, GRIP_R, HEAD, SOUND, FACE, LIGHT, DANCE]
requires:
  arms: active
  tab5: true
  rc_authority: AUTO
music:
  file: audio/beat-demo-120.wav       # the generated click track: no seasonal music is committed
  bpm: 120
  offset_s: 0.5
  beats_per_bar: 4
dance:
  floor_radius_m: 1.5

clips:
  # a two-bar wave, left then right, slow enough not to warn
  wave_both:
    length_beats: 8
    cues:
      - { beat: 1, slot: ARM_L, joints: { 7: 15 } }
      - { beat: 3, slot: ARM_L, joints: { 7: -15 } }
      - { beat: 5, slot: ARM_R, joints: { 7: 15 } }
      - { beat: 7, slot: ARM_R, joints: { 7: -15 } }

cues:
  - { t: 0.0, slot: LIGHT, do: color, rgb: [255, 236, 190], br: 70 }    # warm white — a saturated gold reads as DEGRADED amber
  - { t: 0.0, slot: FACE, do: emote, name: SOFT }
  - { bar: "1.1", slot: SOUND, do: play, sound: attend }
  - { bar: "1.1", slot: HEAD, pan: 90, tilt: 95 }

  # arms open to a greeting pose by bar 3
  - { bar: "3.1", slot: ARM_L, joints: { 2: 25, 4: 60 } }
  - { bar: "3.1", slot: ARM_R, joints: { 2: 25, 4: 60 } }
  - { bar: "3.1", slot: GRIP_L, do: open }
  - { bar: "3.1", slot: GRIP_R, do: open }

  # the wave, twice, with the light alternating gold and white
  - { bar: "4.1", clip: wave_both }
  - { bar: "4.1", slot: LIGHT, do: color, rgb: [255, 255, 255], br: 60 }
  - { bar: "5.1", slot: LIGHT, do: color, rgb: [255, 236, 190], br: 70 }
  - { bar: "6.1", clip: wave_both }
  - { bar: "6.1", slot: LIGHT, do: color, rgb: [140, 190, 255], br: 70 }  # cold blue

  # a little sway on the downbeats
  - { bar: "8.1", slot: DANCE, move: sway, secs: 2 }
  - { bar: "9.1", slot: DANCE, move: sway, secs: 2 }

  # close: arms down, head nods, lights back to the robot
  - { bar: "10.1", slot: GRIP_L, do: close }
  - { bar: "10.1", slot: GRIP_R, do: close }
  - { bar: "12.1", slot: ARM_L, joints: { 2: 5, 4: 10, 7: 0 } }
  - { bar: "12.1", slot: ARM_R, joints: { 2: 5, 4: 10, 7: 0 } }
  - { bar: "12.1", slot: HEAD, tilt: 82 }
  - { bar: "12.3", slot: HEAD, tilt: 90 }
  - { bar: "13.1", slot: SOUND, do: play, sound: heard }
  - { bar: "13.1", slot: LIGHT, do: release }

# WHAT THIS SHOW WANTED AND COULD NOT SAY (notes/design/choreo-example-shows.md):
#  - red and green: red is the state light's E-STOP colour, now refused (plan 1.8); green is
#    SAFE IDLE's, still allowed but avoided here
#  - a Christmas face theme: no cue selects a theme
#  - "wave the right arm the way the left one did": a clip cannot be mirrored onto the other arm,
#    so wave_both spells out each arm
#  - sleigh bells: a sound file must exist to validate, and a seasonal one would not be committed
