# OpenDubs — rotate the HSD088IPW1 touch coordinates to match the 90° (xrandr
# "left") display rotation. Matrix for a left/CCW rotation is:
#     0 -1 1   1 0 0   0 0 1
# Install to /etc/X11/xorg.conf.d/99-opendubs-touch.conf
Section "InputClass"
    Identifier  "OpenDubs HSD088 touch rotate"
    MatchProduct "QDtech MPI7019"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "TransformationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection
