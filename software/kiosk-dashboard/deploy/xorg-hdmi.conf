# OpenDubs — force the no-EDID HSD088IPW1 (Hosyond 8.8" 1920x480) panel on HDMI-0.
#
# The panel is physically 480x1920 portrait and provides no EDID/HPD, so we:
#   - force HDMI-0 "connected" and allow non-EDID modes
#   - feed it the panel's native 480x1920 @ ~75.84MHz timing
# Rotation to 1920x480 landscape is done at runtime via xrandr in
# deploy/kiosk-session.sh (the Tegra nvidia driver ignores Option "Rotate").
# Touch coordinate rotation is handled by deploy/99-opendubs-touch.conf.
#
# Install to /etc/X11/xorg.conf.

Section "Module"
    Disable     "dri"
    SubSection  "extmod"
        Option  "omit xfree86-dga"
    EndSubSection
EndSection

# Never blank/standby/suspend/power-off the panel — this is a kiosk. (Also
# matters because this combo panel powers its touch board with the display;
# if the panel sleeps, touch stops too.)
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Device"
    Identifier  "Tegra0"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
    BusID       "PCI:1:0:0"
    Option      "ConnectedMonitor" "HDMI-0"
    Option      "ModeValidation" "HDMI-0: NoEdidModes, AllowNonEdidModes"
EndSection

Section "Monitor"
    Identifier  "BarLCD"
    HorizSync   100-140
    VertRefresh 50-75
    # HSD088IPW1 native: 480 fp48 sync32 bp80 / 1920 fp3 sync10 bp56 @ 75.84MHz
    Modeline "480x1920_hsd" 75.84 480 528 560 640 1920 1923 1933 1989 +hsync -vsync
    Option      "DPMS" "false"
    Option      "PreferredMode" "480x1920_hsd"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Tegra0"
    Monitor     "BarLCD"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "480x1920_hsd"
    EndSubSection
EndSection
