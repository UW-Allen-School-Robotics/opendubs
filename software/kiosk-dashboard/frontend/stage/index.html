<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDubs stage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; cursor: none; }
    video, canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; }
    #hud { position: fixed; left: 12px; bottom: 10px; font: 14px/1.3 system-ui, sans-serif; color: #9fd; opacity: .8;
           white-space: pre; display: none; }
  </style>
</head>
<body>
  <!-- The stage page (notes/design/choreo-stage.md): the projector's picture — a video, if given, and the
       skeletons drawn over it. Only skeleton points reach this page; no camera image, ever. -->
  <video id="video" muted playsinline loop hidden></video>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <script src="stage.js"></script>
</body>
</html>
