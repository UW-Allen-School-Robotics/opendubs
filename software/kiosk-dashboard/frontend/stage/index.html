<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDubs stage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; cursor: none; }
    /* #wall is the screen as it is SEEN: a screen that stretches its input (?stretch=2, a video wall that
       spreads a 16:9 frame over a 32:9 wall) gets a #wall that many times wider, squeezed back into the
       frame, so on the wall everything has its own shape. Off (1) on every other screen. */
    #wall { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; overflow: hidden; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #hud { position: absolute; left: 12px; bottom: 10px; font: clamp(11px, 1.1vmin, 22px)/1.3 system-ui, sans-serif;
           color: #9fd; opacity: .8; white-space: pre; display: none; }
    /* the STAGE READY card, between shows: sized from the screen, so it reads on a phone and on a video wall */
    #card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: min(90%, 34em);
            max-width: 94%; padding: 1.1em 1.4em; border-radius: .6em; background: rgba(4, 7, 15, .82);
            border: 1px solid #2a4a66; color: #dfe9f3; font: clamp(13px, 2.2vmin, 40px)/1.45 system-ui, sans-serif; }
    #card b { display: block; margin-bottom: .5em; color: #9fd; }
    #card .row { display: flex; justify-content: space-between; gap: 2em; }
    #card .row span:first-child { color: #8aa; }
    #card .bad span:last-child { color: #ffb86b; font-weight: 600; }
  </style>
</head>
<body>
  <!-- The stage page (notes/design/choreo-stage.md): the projector's picture — a video, if given, and the
       skeletons drawn over it. Only skeleton points reach this page; no camera image, ever. -->
  <div id="wall">
    <video id="video" muted playsinline loop hidden></video>
    <canvas id="stage"></canvas>
    <div id="card" hidden></div>
    <div id="hud"></div>
  </div>
  <script src="stage.js"></script>
</body>
</html>
