# Controllers for the arms, in gafro's control spec (gafro.control.spec): what each does and what it is driven with. A stage states the
# error it receives, the objective that measures it, the law that decides and what it hands the controller; stages are highest
# priority first. SI units; natural frequencies in rad/s.
#
# STARTING VALUES: the gains and speeds are not tuned on an arm. What is the arm's own (torque and velocity limits, joint ranges) is
# not here but in the model (openarm_assets), and `limits: {joint_torque: model}` reads it from there. What is this robot's (the head)
# is in hardware.example.yaml. These are the task's: free-space tracking of a pose, which is what teleop and a policy's pose
# references drive.
#
# The OpenArm does not cancel its own gravity (its driver says so), so a torque controller does: `gravity: 9.81`.

controllers:
  # Operational-space control: the hand follows `reference`, the posture stage uses the redundancy, the guards act only near a joint
  # limit or a singular configuration and are zero otherwise.
  free:
    inputs: {reference: pose, posture: joints}
    type: torque
    gravity: 9.81
    regularization: 0.05
    limits: {joint_torque: model}
    stages:
      - name: guards
        stack:
          - input: joints
            objective: {joint_limits: {margin: 0.35}}
            law: {pd: {natural_frequency: 20, damping_ratio: 1.0, max_speed: 3.0}}
          - input: singular_values
            objective: {singular_values: {floor: 0.06}}
            law: {pd: {natural_frequency: 10, damping_ratio: 1.0, max_speed: 3.0}}
        output: acceleration
      - name: pose
        input: pose
        objective: {pose: {target: reference}}
        # The speed of the hand: DEC-16 keeps 1.0 m/s as the working limit and a lower one for events; this is the lower one.
        law: {pd: {natural_frequency: 40, damping_ratio: 1.0, max_speed: {linear: 0.5, angular: 1.5}}}
        output: acceleration
      - name: posture
        input: joints
        objective: {posture: {target: posture}}
        law: {pd: {natural_frequency: 4, damping_ratio: 1.0, max_speed: 0.5}}
        output: acceleration

  # An impedance: the hand is a spring-damper about `reference`, applied as J^T w with no model inertia. Simpler, softer, and the one
  # to start a first run on an arm with.
  impedance:
    inputs: {reference: pose}
    type: torque
    gravity: 9.81
    regularization: 0.05
    limits: {joint_torque: model}
    stages:
      - name: pose
        input: pose
        objective: {pose: {target: reference}}
        law: {pd: {stiffness: {linear: 400, angular: 25}, damping: {linear: 40, angular: 4}}}
        output: wrench
