# Controllers for the arms, in gafro's control spec (gafro.control.spec): what each does and what it is driven with. A stage states the
# error it receives, the objective that measures it, the law that decides and what it hands the controller; stages are highest
# priority first. SI units; natural frequencies in rad/s.
#
# Position controllers only. The torque ones (`track`, `engage`, `freedrive`) were removed: torque control does not move this arm
# (tools/README.md, "What is known"). What is the arm's own (joint velocity limits, joint ranges) is not here but in the model
# (openarm_assets), and `limits: {joint_velocity: model}` reads it from there. What is this robot's (the head) is in hardware.example.yaml.
# The driver adds gravity as a feed-forward, so no controller here carries a gravity term.

controllers:
  # Free-space tracking of a pose, as a POSITION controller, for live pose targets (arm_service.py `ctl follow`): the stages are a velocity controller's (output velocity,
  # resolved through the kinematics), run on an anchor that their own velocity moves, and the integrated anchor is the command -- joint positions and velocities,
  # like the MIT frame the driver sends (position, dq_ref, the motor's own kp and kd, gravity as a feed-forward). The motor's PD supplies the stiffness, so no loop
  # here is closed over the bus and the gains can be high; it needs no gravity term, the driver adds its own.
  # STARTING VALUES, tuned in the simulator only (a closed hand circle, two laps), not on an arm. The guard margin is 0.01 rad: at 0.35 it sat above the pose stage and froze the hand
  # on the second lap, when the first lap's null-space drift had put a joint inside the margin.
  follow_pose:
    inputs: {reference: pose, reference_rate: twist, posture: joints}   # reference_rate: the target's twist in the tool frame, estimated by pose_follow.py
    type: position
    maximum_lead: 0.02          # rad per joint: the offset that closes what the actuator did not do (friction dead band)
    maximum_error: 0.15         # rad per joint: the leash of the anchor on the measured position
    offset_gain: 2.0            # 1/s
    regularization: 0.05
    limits: {joint_velocity: model}
    stages:
      - name: guards
        input: joints
        objective: {joint_limits: {margin: 0.01}}
        law: {pd: {gain: 5.0, max_speed: 1.0}}
        output: velocity
      - name: pose
        input: pose
        objective: {pose: {target: reference}}
        law: {pd: {gain: 40.0, max_speed: {linear: 0.5, angular: 1.5}, feedforward: reference_rate}}      # sim, closed 8 cm circle: mean hand error 10.7 mm at 10, 6.1 at 20, 3.8 at 40, 2.6 at 80
        output: velocity
      - name: posture
        input: joints
        objective: {posture: {target: posture}}
        law: {pd: {gain: 2.0, max_speed: 0.5}}
        output: velocity

  # Playing a PATH: a joint-space path (a trajectory, `activate` and `park`, a choreography show, a planned hand move) is a posture reference, given whole, with the joint rates along it.
  # Same machinery as `follow_pose` (a position controller: the stage's velocity moves an anchor, the integrated anchor is the command, the motor's PD and the driver's gravity
  # feed-forward close the loop), but the reference is known ahead, so its rate is fed forward and the anchor follows without the lag rate / gain. play_show and track_hand
  # take flags over these (`--gain`, `--max-lead`, `--leash`, `--offset-gain`, `--max-command-speed`, `--no-feedforward`); position_play.py builds it.
  follow_path:
    inputs: {posture: joints, posture_rate: joint_rates}
    type: position
    maximum_lead: 0.02          # rad per joint: the offset that closes what the actuator did not do (friction dead band)
    maximum_error: 0.15         # rad per joint: the leash of the anchor on the measured position; a held joint is never asked for more than kp * this beyond the path
    offset_gain: 2.0            # 1/s: low, a high gain hunts against friction
    regularization: 0.05
    limits: {joint_velocity: model}
    stages:
      - name: posture
        input: joints
        objective: {posture: {target: posture}}
        law: {pd: {gain: 20.0, max_speed: 0.5, feedforward: posture_rate}}   # gain: no actuator is in this loop, so it can be high; max_speed caps what the feedback asks for
        output: velocity
