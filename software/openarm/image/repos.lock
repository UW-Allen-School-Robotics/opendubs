# Every source repository the openarm image is built from, at the exact commit it is built at.
# Arms plan DEC-27 (design: notes/design/arm-sources.md): each from its maintainer at a recorded
# commit -- a release where it is current, else main. The student forks of the lab's libraries are
# NOT here: their changes are carried as patches in overlay/<name>/, applied by build.sh.
#
# Not here, on purpose:
#   - the workspace root: ours, in workspace/ (pyproject.toml and its committed uv.lock)
#   - ssik: a uv git source at its v8.1.0 tag, pinned by workspace/uv.lock, built non-editable
#   - mujoco_menagerie: only the lab's demos for other arms use it
#
# kind:  uv   a Python workspace member (marked COLCON_IGNORE)
#        ros  a colcon package
#
# build.sh reads the uncommented lines as: name kind url commit -- nothing may follow the commit.

