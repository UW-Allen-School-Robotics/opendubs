// shairport-sync configuration for the OpenDubs AirPlay-compatible receiver.
// A TEMPLATE: installed to /etc/opendubs/airplay/shairport-sync.conf; airplay-run.sh fills in
// @ADDRESS@ at each start and mounts the result read-only into the container.
// The advertised name comes from the command line (-a "$OPENDUBS_ROBOT_NAME"), not from here.
// The PCM and metadata formats below are a CONTRACT with the dashboard's airplay_relay.py
// (Tablet lane): change them together. See README.md.

general =
{
	output_backend = "pipe";
	// IPv4 only. A sender that connects over IPv6 link-local is handed to nqptp WITHOUT an interface
	// scope, so nqptp cannot reach it, never gets a PTP master clock, and nothing plays ("No NQPTP
	// master clock", opendubs2 2026-10-14). Binding the control socket to the robot's IPv4 address
	// makes senders connect over IPv4.
	address = "@ADDRESS@";
	interpolation = "auto";
	ignore_volume_control = "no";                     // the sender's volume, applied here in software
	audio_backend_latency_offset_in_seconds = -0.3;   // the relay to the tablet adds about 0.3 s
};

sessioncontrol =
{
	session_timeout = 60;                             // seconds before a vanished sender frees the receiver (0, or at least 60)
};

pipe =
{
	name = "/run/opendubs/airplay/audio.pcm";
	output_rate = 44100;
	output_format = "S16_LE";
	output_channels = 2;
};

metadata =
{
	enabled = "yes";
	include_cover_art = "no";
	pipe_name = "/run/opendubs/airplay/meta";
	pipe_timeout = 5000;
};

diagnostics =
{
	log_verbosity = 0;
};
