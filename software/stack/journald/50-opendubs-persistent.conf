# Keep the system journal across reboots, so the last boot's tail can be read after a hang or a power
# cut (`journalctl -b -1`). The robot powers down most nights; with the default (Storage=auto and no
# /var/log/journal) every boot started with an empty journal. Installed by provision-all.sh.
#
# 1 GB of history, and never let the journal eat into the last 10 GB of the disk.
# SyncIntervalSec: write to disk every 15 s, not journald's default 5 min (only crit and worse are
# written at once). A hang that ends in a power cut otherwise loses the last minutes before it, which
# are the part we keep the journal for.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=10G
SyncIntervalSec=15s
