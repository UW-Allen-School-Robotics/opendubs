# The stage box (WirePlumber 0.5, Raspberry Pi OS trixie): Bluetooth audio whether or not a login
# session is "active" on a seat. The box has no desktop; PipeWire runs in the `stage` user's lingering
# session, and seat monitoring would otherwise keep the Bluetooth speaker away until one is.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
