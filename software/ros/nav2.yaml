# Nav2 for OpenDubs, behind the base lease (nav2.launch.py). Goals in `map`, or in a floor frame that TF
# joins to `map` (<floor> -> map, floor_frames.py from site.yaml): bt_navigator transforms them on arrival.
# Localization is ours (slam_toolbox: map -> odom; the drive bridge: odom -> base_link), so there is no
# AMCL and no map_server: the global costmap reads SLAM's /map.
#
# Speeds sit under the drive bridge's AUTO cap (about 0.38 m/s forward on opendubs2, notes/per-robot-
# calibration.md), which scales anything faster down to it anyway, so a speed set here is a request,
# never a way past the cap. The footprint is the chassis box from description/opendubs/dimensions.yaml
# (644 x 649 mm about base_link), plus 2 cm.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.3      # /odom arrives at ~8.7 Hz
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0     # a released deadman stops the base: the goal fails after this
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0     # keeps the stream above the drive bridge's 0.25-0.5 s command timeout
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.6]
    min_velocity: [-0.15, 0.0, -0.6]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -1.2]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05            # slam_toolbox.yaml's, so cells line up with /map
      transform_tolerance: 0.3
      footprint: "[[0.345, 0.345], [0.345, -0.345], [-0.345, -0.345], [-0.345, 0.345]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer", "denoise_layer"]
      # The observation sources, ranges and heights of the costmap the 2026-10-30 demo ran (sid/nav)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan scan_rear depth
        scan:
          topic: /scan_filtered   # /scan less the robot body (scan_body_filter)
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 11.9    # a no-return is inserted at the scan's 12 m; marking stops short of it
          raytrace_max_range: 12.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0    # the source default of 0 drops this scan: the beam is 0.24 m up
          inf_is_valid: true          # an empty ray clears
        scan_rear:
          topic: /scan_rear_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 11.9
          raytrace_max_range: 12.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
        depth:
          topic: /scan_depth      # depth_scan.yaml: the depth camera flattened in base_link, 0.27-1.07 m up
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 5.0     # shorter than the camera's 7 m: the head can tilt
          raytrace_max_range: 5.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: true
      footprint: "[[0.345, 0.345], [0.345, -0.345], [-0.345, -0.345], [-0.345, 0.345]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map              # slam_toolbox's
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan scan_rear depth
        scan:
          topic: /scan_filtered   # /scan less the robot body (scan_body_filter)
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 11.9    # a no-return is inserted at the scan's 12 m; marking stops short of it
          raytrace_max_range: 12.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0    # the source default of 0 drops this scan: the beam is 0.24 m up
          inf_is_valid: true          # an empty ray clears
        scan_rear:
          topic: /scan_rear_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 11.9
          raytrace_max_range: 12.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
        depth:
          topic: /scan_depth      # depth_scan.yaml: the depth camera flattened in base_link, 0.27-1.07 m up
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 5.0     # shorter than the camera's 7 m: the head can tilt
          raytrace_max_range: 5.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "planner_server", "behavior_server", "velocity_smoother", "bt_navigator"]

