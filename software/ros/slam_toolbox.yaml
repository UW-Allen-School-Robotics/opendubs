# slam_toolbox on the front scan only (lidar-frames-and-fusion.md:
# a merged scan comes later and only for SLAM). Parameters not set here keep slam_toolbox's own
# defaults.
slam_toolbox:
  ros__parameters:
    odom_frame: odom              # drive_bridge publishes odom -> base_link from the Pinpoint
    map_frame: map
    base_frame: base_link         # slam_toolbox's default is base_footprint
    scan_topic: /scan_filtered    # /scan less the robot's own returns (scan_body_filter.py)
    mode: mapping                 # slam.launch.py switches to localization when the site file names a saved map
    resolution: 0.05
    max_laser_range: 8.0          # the A1's useful indoor range, not its 12 m best case
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    # Sequential scan match, including the scan right after /initialpose.
    # 0.1 m is the full grid (about ±5 cm). 0.0349 rad is ±2 deg.
    # Expansion off: a miss must not widen the angle by 20 deg.
    # Smear was 0.1 m, the whole new grid, so the peak could sit anywhere in it.
    correlation_search_space_dimension: 0.1
    correlation_search_space_smear_deviation: 0.02
    coarse_search_angle_offset: 0.0349
    use_response_expansion: false
    map_update_interval: 2.0
    transform_timeout: 0.3        # /odom arrives at ~8.7 Hz
    tf_buffer_duration: 30.0
    do_loop_closing: true
