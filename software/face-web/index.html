<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot face</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #face, #media { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #media { object-fit: cover; visibility: hidden; background: #000; }
  #hud { position: fixed; left: 8px; bottom: 6px; color: #9fb; font: 12px ui-monospace, monospace; white-space: pre; }
  /* The operator's way out of the face (engine/operator.js): a long-press, never a single tap. */
  #op { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; gap: 28px;
        background: rgba(0,0,0,.72); font: 600 28px system-ui, sans-serif; }
  #op.open { display: flex; }
  #op button { min-width: 230px; min-height: 120px; border-radius: 22px; border: 0; font: inherit; color: #fff; }
  #op .stop { background: #c62828; } #op .dash { background: #1f6feb; } #op .back { background: #333; }
  #op .note { position: fixed; bottom: 40px; left: 0; right: 0; text-align: center; color: #ccc; font-size: 20px; }
  /* How to find the controls: shown for a moment after a short tap, never on its own (operator.js). */
  #hint { position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center; pointer-events: none;
          font: 500 22px system-ui, sans-serif; color: #9a9a9a; opacity: 0; transition: opacity .3s; }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<video id="media" playsinline preload="auto"></video>
<div id="hud"></div>
<div id="hint" aria-live="polite">Hold anywhere to open controls</div>
<div id="op" role="dialog" aria-label="Operator">
  <button class="stop" id="opStop">STOP SHOW</button>
  <button class="dash" id="opDash">DASHBOARD</button>
  <button class="back" id="opBack">FACE</button>
  <div class="note" id="opNote">The RC deadman and the e-stop stop everything, always.</div>
</div>
<script type="module" src="engine/boot.js"></script>
</body>
</html>
